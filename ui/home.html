<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src https: data:">
<title>Nouvel onglet</title>
<style>
:root { --accent: __ACCENT__; --ease: cubic-bezier(.22,1,.36,1); --spring: cubic-bezier(.3,1.35,.5,1);
  --glow: color-mix(in srgb, var(--accent) 45%, transparent); --card: #17171b; --line: #2a2a30; --dim: #8e8e98; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: radial-gradient(ellipse 90% 60% at 50% 115%, color-mix(in srgb, var(--accent) 24%, transparent), transparent 62%),
    radial-gradient(ellipse 50% 40% at 85% -10%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 70%), #0d0d10;
  color: #f2f2f5; font: 14px "Segoe UI Variable Text", "Segoe UI", "Inter", "Cantarell", system-ui, sans-serif; overflow-x: hidden; user-select: none; }
.grid { position: fixed; inset: 0; pointer-events: none; contain: strict;
  background-image: linear-gradient(#ffffff08 1px, transparent 1px), linear-gradient(90deg, #ffffff08 1px, transparent 1px); background-size: 52px 52px; }
/* fondu de la grille : un dégradé posé dessus (bien moins coûteux qu'un masque) */
.grid::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 70% 60% at 50% 55%, transparent 10%, #0d0d10 75%); }
body.nowall .grid { display: none; }
main { position: relative; width: min(880px, 92vw); margin: 0 auto; padding: 9vh 0 60px; display: flex; flex-direction: column; align-items: center; }

/* Horloge */
.clock { font-size: 84px; font-weight: 200; letter-spacing: 2px; line-height: 1; font-variant-numeric: tabular-nums;
  background: linear-gradient(180deg, #fff 30%, color-mix(in srgb, var(--accent) 70%, #fff)); -webkit-background-clip: text; background-clip: text; color: transparent;
  text-shadow: none; }
.clock-wrap { position: relative; }
.date { margin-top: 10px; color: var(--dim); font-size: 14px; letter-spacing: .4px; }
.date b { color: #f2f2f5; font-weight: 600; }

/* Recherche */
form { width: min(640px, 100%); display: flex; align-items: center; height: 54px; margin-top: 34px; padding-left: 18px;
  background: #141418; border: 1px solid var(--line); border-radius: 14px;
  transition: border-color .25s, box-shadow .3s var(--ease); }
form:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
form svg { width: 18px; height: 18px; color: var(--dim); flex: none; }
form input { will-change: contents; contain: paint; flex: 1; height: 100%; background: none; border: 0; outline: 0; color: inherit; font: inherit; font-size: 16px; padding: 0 14px; user-select: text; }
form input::placeholder { color: #75757f; }
form button { width: 46px; height: 42px; margin-right: 6px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; display: grid; place-items: center;
  transition: filter .2s, transform .15s; }
form button:hover { filter: brightness(1.12); } form button:active { transform: scale(.94); }
form button svg { color: #fff; transition: transform .3s var(--spring); } form:focus-within button svg { transform: translateX(2px); }

/* Raccourcis */
.sect { width: 100%; margin-top: 40px; }
.sect h2 { display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--dim); margin: 0 4px 12px; }
.sect h2::before { content: ""; width: 3px; height: 12px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.sect h2 button { margin-left: auto; font: 600 11px/1 inherit; letter-spacing: .3px; text-transform: none; color: var(--dim); background: none; border: 0; cursor: pointer; padding: 5px 8px; border-radius: 6px; }
.sect h2 button:hover { color: #fff; background: #ffffff10; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; }
.tile { position: relative; height: 108px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 10px;
  background: var(--card); border: 1px solid #ffffff0c; border-radius: 14px; color: #f2f2f5; text-decoration: none; cursor: pointer; font: inherit;
  transition: transform .3s var(--spring), border-color .25s, box-shadow .3s, background .25s; }
.tile:hover { transform: translateY(-4px); border-color: color-mix(in srgb, var(--accent) 55%, transparent); background: #1c1c21;
  box-shadow: 0 14px 30px -14px var(--glow); }
.tile:active { transform: translateY(-1px) scale(.97); }
.tile .ic { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: #ffffff0d; transition: transform .35s var(--spring); }
.tile:hover .ic { transform: scale(1.1); }
.tile .ic img { width: 30px; height: 30px; object-fit: contain; }
.tile .nm { font-size: 12.5px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.av { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; font-size: 15px; color: #fff; text-transform: uppercase; }
.tile .x { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 6px; border: 0; background: #0009; color: #fff; cursor: pointer;
  display: grid; place-items: center; opacity: 0; transform: scale(.6); transition: opacity .15s, transform .25s var(--spring), background .15s; }
.tile:hover .x { opacity: 1; transform: none; }
.tile .x:hover { background: #ff4d6a; }
.tile.add { border-style: dashed; border-color: #ffffff1f; background: transparent; color: var(--dim); }
.tile.add .ic { background: transparent; border: 1px dashed #ffffff30; font-size: 22px; }
.tile.add:hover { color: #fff; }
.tile.drag { opacity: .4; }
.tile.over { border-color: var(--accent); }

/* Les plus visités */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 10px; border-radius: 18px; background: var(--card); border: 1px solid #ffffff0c;
  color: #e8e8ec; text-decoration: none; font-size: 12.5px; transition: border-color .2s, transform .25s var(--spring), background .2s; max-width: 260px; }
.chip:hover { border-color: color-mix(in srgb, var(--accent) 55%, transparent); transform: translateY(-2px); background: #1c1c21; }
.chip img, .chip .av { width: 18px; height: 18px; border-radius: 5px; font-size: 10px; flex: none; }
.chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip small { color: var(--dim); font-size: 11px; flex: none; }

/* Fenêtre d'ajout */
.modal { position: fixed; inset: 0; background: #000c; display: none; place-items: center; z-index: 10; }
.modal.show { display: grid; animation: fade .2s; }
.box { width: min(400px, 92vw); padding: 22px; border-radius: 16px; background: #18181c; border: 1px solid var(--line); box-shadow: 0 30px 80px -20px #000;
  animation: pop .35s var(--spring); }
.box h3 { font-size: 16px; margin-bottom: 16px; }
.box label { display: block; font-size: 11.5px; color: var(--dim); margin: 10px 0 6px; }
.box input { width: 100%; height: 40px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line); background: #0d0d10; color: #fff; font: inherit; outline: 0; user-select: text;
  transition: border-color .2s, box-shadow .2s; }
.box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.box .err { color: #ff7a8c; font-size: 12px; min-height: 18px; margin-top: 8px; }
.box .bt { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
.box .bt button { height: 36px; padding: 0 18px; border-radius: 9px; border: 1px solid var(--line); background: #0d0d10; color: #fff; font: 600 13px inherit; cursor: pointer; transition: filter .2s; }
.box .bt .ok { background: var(--accent); border-color: var(--accent); }
.box .bt button:hover { filter: brightness(1.15); }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.96); } }
@keyframes fade { from { opacity: 0; } }

/* Entrée animée */
.clock, .date, form, .sect { animation: up .8s var(--ease) both; }
.date { animation-delay: .06s; } form { animation-delay: .12s; } .sect { animation-delay: .2s; } .sect + .sect { animation-delay: .28s; }
.tile { animation: up .6s var(--ease) both; animation-delay: calc(.22s + var(--i) * 35ms); }
@keyframes up { from { opacity: 0; transform: translateY(14px); } }
body.noanim *, body.noanim *::before, body.noanim *::after { animation: none !important; transition: none !important; }
</style>
</head>
<body class="__BODY__">
<div class="grid"></div>
<main>
  <div class="clock" id="clock">--:--</div>
  <div class="date" id="date"></div>
  <form id="f" autocomplete="off">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" autofocus placeholder="Rechercher sur le web ou saisir une adresse">
    <button aria-label="Rechercher"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </form>
  <section class="sect"><h2>Raccourcis <button id="reset" title="Revenir aux raccourcis d'origine">Réinitialiser</button></h2><div class="tiles" id="tiles"></div></section>
  <section class="sect" id="topsec"><h2>Les plus visités</h2><div class="chips" id="top"></div></section>
</main>
<div class="modal" id="modal"><div class="box">
  <h3>Ajouter un raccourci</h3>
  <label for="mn">Nom</label><input id="mn" maxlength="40" placeholder="Ex. : Twitch">
  <label for="mu">Adresse</label><input id="mu" placeholder="twitch.tv">
  <div class="err" id="merr"></div>
  <div class="bt"><button id="mc">Annuler</button><button class="ok" id="mo">Ajouter</button></div>
</div></div>
<script>
(() => {
  'use strict';
  const SEARCH = __SEARCH__;
  let tiles = __TILES__;
  const TOP = __TOP__;
  const ICONS = __ICONS__;
  const DEFAULT = [["YouTube","https://www.youtube.com"],["Twitch","https://www.twitch.tv"],["Steam","https://store.steampowered.com"],["Reddit","https://www.reddit.com"],["Discord","https://discord.com/app"],["Epic Games","https://store.epicgames.com"],["Wikipédia","https://fr.wikipedia.org"],["GitHub","https://github.com"]].map(([name, url]) => ({ name, url }));
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const hostOf = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (_) { return ''; } };
  const hue = (s) => { let x = 0; for (const c of s) x = (x * 31 + c.charCodeAt(0)) >>> 0; return x % 360; };
  const avatar = (host) => { const a = el('span', 'av', (host || '?')[0]); a.style.background = `hsl(${hue(host)} 55% 40%)`; return a; };
  function siteIcon(url) {
    const host = hostOf(url);
    if (!ICONS || !host) return avatar(host);
    const img = el('img'); img.alt = ''; img.referrerPolicy = 'no-referrer';
    img.onerror = () => img.replaceWith(avatar(host));
    try { img.src = new URL(url).origin.replace(/^http:/, 'https:') + '/favicon.ico'; } catch (_) { return avatar(host); }
    return img;
  }

  // ---- Horloge (mise à jour à chaque minute seulement : rien ne tourne pour rien)
  function tick() {
    const d = new Date(), hr = d.getHours();
    $('clock').textContent = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    const hello = hr < 5 ? 'Bonne nuit' : hr < 12 ? 'Bonjour' : hr < 18 ? 'Bon après-midi' : 'Bonsoir';
    const date = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    $('date').replaceChildren(el('b', '', hello), document.createTextNode(' · ' + date.charAt(0).toUpperCase() + date.slice(1)));
    setTimeout(tick, (60 - d.getSeconds()) * 1000 + 50);
  }
  tick();

  // ---- Recherche
  $('f').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = $('q').value.trim();
    if (!v) return;
    const isUrl = /^https?:\/\//i.test(v) || /^[^\s]+\.[a-z]{2,}(:\d+)?(\/.*)?$/i.test(v);
    location.href = isUrl ? (/^https?:\/\//i.test(v) ? v : 'https://' + v) : SEARCH.replace('{}', encodeURIComponent(v));
  });

  // ---- Raccourcis
  // Ferrox écoute cet événement uniquement sur sa propre page d'accueil.
  const save = () => { document.dispatchEvent(new CustomEvent('fx-tiles', { detail: JSON.stringify(tiles) })); };
  let dragFrom = -1;
  function render() {
    const box = $('tiles'); box.replaceChildren();
    tiles.forEach((t, i) => {
      const a = el('a', 'tile'); a.href = t.url; a.draggable = true; a.style.setProperty('--i', i); a.title = t.url;
      const ic = el('span', 'ic'); ic.append(siteIcon(t.url));
      const x = el('button', 'x', '✕'); x.title = 'Retirer';
      x.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); tiles.splice(i, 1); save(); render(); });
      a.append(ic, el('span', 'nm', t.name), x);
      a.addEventListener('dragstart', () => { dragFrom = i; a.classList.add('drag'); });
      a.addEventListener('dragend', () => a.classList.remove('drag'));
      a.addEventListener('dragover', (e) => { e.preventDefault(); a.classList.add('over'); });
      a.addEventListener('dragleave', () => a.classList.remove('over'));
      a.addEventListener('drop', (e) => {
        e.preventDefault(); a.classList.remove('over');
        if (dragFrom < 0 || dragFrom === i) return;
        const [m] = tiles.splice(dragFrom, 1); tiles.splice(i, 0, m); dragFrom = -1; save(); render();
      });
      box.append(a);
    });
    if (tiles.length < 16) {
      const add = el('button', 'tile add'); add.style.setProperty('--i', tiles.length);
      const ic = el('span', 'ic', '+'); add.append(ic, el('span', 'nm', 'Ajouter'));
      add.addEventListener('click', openModal);
      box.append(add);
    }
  }
  $('reset').addEventListener('click', () => { tiles = DEFAULT.slice(); save(); render(); });

  function openModal() { $('mn').value = ''; $('mu').value = ''; $('merr').textContent = ''; $('modal').classList.add('show'); setTimeout(() => $('mu').focus(), 30); }
  const closeModal = () => $('modal').classList.remove('show');
  $('mc').addEventListener('click', closeModal);
  $('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
  function addTile() {
    let u = $('mu').value.trim();
    if (!u) { $('merr').textContent = 'Saisissez une adresse.'; return; }
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    u = u.replace(/^http:\/\//i, 'https://');
    const host = hostOf(u);
    if (!host || !host.includes('.')) { $('merr').textContent = 'Adresse invalide.'; return; }
    const name = $('mn').value.trim() || host.split('.').slice(-2, -1)[0].replace(/^./, (c) => c.toUpperCase());
    tiles.push({ name, url: u }); save(); render(); closeModal();
  }
  $('mo').addEventListener('click', addTile);
  ['mn', 'mu'].forEach((id) => $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') addTile(); if (e.key === 'Escape') closeModal(); }));

  // ---- Les plus visités (depuis l'historique local)
  if (TOP.length) {
    for (const s of TOP) {
      const a = el('a', 'chip'); a.href = s.url; a.title = s.title;
      a.append(siteIcon(s.url), el('span', '', s.host), el('small', '', s.n + '×'));
      $('top').append(a);
    }
  } else $('topsec').style.display = 'none';
  render();
})();
</script>
</body>
</html>
