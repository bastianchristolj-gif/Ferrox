<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Ferrox</title>
<style>
:root {
  --accent: #fa1e4e;
  --accent-dk: color-mix(in srgb, var(--accent) 58%, #000);
  --frame: #0c0c0e;      /* barre d'onglets */
  --bar: #161618;        /* barre de navigation */
  --panel-bg: #121214;
  --hover: #232327;
  --line: #2a2a2f;
  --text: #f1f1f3;
  --dim: #9a9aa2;
  --top: 74px; --border: 3px; --panel: 320px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--frame); color: var(--text);
  font: 12.5px/1.35 "Segoe UI", "Inter", "Cantarell", system-ui, sans-serif; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Liseré d'accent autour de la fenêtre */
#frame { position: fixed; inset: 0; border: 1px solid var(--accent-dk); pointer-events: none; z-index: 5; }
body.max #frame { display: none; }
.rz { position: fixed; z-index: 6; }
body.max .rz { display: none; }
.rz.n { top: 0; left: 8px; right: 8px; height: 3px; cursor: n-resize; }
.rz.s { bottom: 0; left: 8px; right: 8px; height: 3px; cursor: s-resize; }
.rz.w { left: 0; top: 8px; bottom: 8px; width: 3px; cursor: w-resize; }
.rz.e { right: 0; top: 8px; bottom: 8px; width: 3px; cursor: e-resize; }
.rz.nw { left: 0; top: 0; width: 8px; height: 8px; cursor: nw-resize; }
.rz.ne { right: 0; top: 0; width: 8px; height: 8px; cursor: ne-resize; }
.rz.sw { left: 0; bottom: 0; width: 8px; height: 8px; cursor: sw-resize; }
.rz.se { right: 0; bottom: 0; width: 8px; height: 8px; cursor: se-resize; }

/* ---------- Rangée 1 : logo + onglets + contrôles fenêtre ---------- */
#titlebar { height: 36px; display: flex; align-items: center; padding: 0 4px 0 6px; background: var(--frame); }
#logo { width: 32px; height: 32px; display: grid; place-items: center; color: var(--accent); flex: none; }
#logo svg { width: 22px; height: 22px; stroke-width: 2.2; filter: drop-shadow(0 0 4px color-mix(in srgb, var(--accent) 60%, transparent)); }
.tb-ic { width: 30px; height: 28px; display: grid; place-items: center; color: var(--dim); border-radius: 5px; flex: none; }
.tb-ic:hover { color: var(--text); background: var(--hover); }
#tabs { flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; gap: 4px; padding: 0 6px; overflow: hidden; }
.tab { height: 28px; min-width: 48px; max-width: 200px; flex: 1 1 190px; display: flex; align-items: center; gap: 7px;
  padding: 0 6px 0 9px; border-radius: 5px; background: transparent; color: var(--text); cursor: default; transition: background .12s; }
.tab:hover { background: var(--hover); }
.tab.active { background: var(--accent-dk); }
.tab.active:hover { background: color-mix(in srgb, var(--accent) 66%, #000); }
.tab.sleeping:not(.active) { color: var(--dim); }
.tab.private:not(.active) { box-shadow: inset 0 -2px 0 #8b5cf6; }
.tab .t { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab .ic { width: 14px; height: 14px; flex: none; display: grid; place-items: center; }
.tab .ic svg { width: 14px; height: 14px; }
.tab.active .ic { color: #fff; }
.tab .x { width: 18px; height: 18px; border-radius: 4px; display: none; place-items: center; flex: none; }
.tab:hover .x, .tab.active .x { display: grid; }
.tab .x:hover { background: #ffffff26; }
.tab .x svg { width: 11px; height: 11px; }
.spin { width: 12px; height: 12px; border: 2px solid #ffffff33; border-top-color: #fff; border-radius: 50%; animation: s .7s linear infinite; }
@keyframes s { to { transform: rotate(360deg); } }
#newtab { width: 26px; height: 26px; flex: none; display: grid; place-items: center; color: var(--dim); border-radius: 5px; }
#newtab:hover { color: var(--text); background: var(--hover); }
#drag { flex: 0 0 40px; height: 100%; }
#winctl { display: flex; align-items: center; gap: 2px; flex: none; }
.wc { width: 34px; height: 28px; display: grid; place-items: center; color: var(--accent); border-radius: 5px; }
.wc:hover { background: var(--hover); }
.wc.close:hover { background: var(--accent); color: #fff; }
.wc svg { width: 15px; height: 15px; }

/* ---------- Rangée 2 : navigation ---------- */
#bar { height: 38px; display: flex; align-items: center; gap: 2px; padding: 0 8px; background: var(--bar); }
.nb { width: 30px; height: 28px; border-radius: 5px; display: grid; place-items: center; color: var(--text); flex: none; }
.nb:hover { background: var(--hover); }
.nb.acc { color: var(--accent); }
.nb.off { color: #5c5c63; }
#urlbox { flex: 1; min-width: 0; height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 10px; margin: 0 6px;
  border-radius: 5px; transition: background .12s; }
#urlbox:hover { background: #1d1d20; }
#urlbox:focus-within { background: #0e0e10; box-shadow: inset 0 0 0 1px var(--accent-dk); }
#lock { color: var(--dim); display: grid; } #lock.insecure { color: #ffb020; }
#lock svg { width: 14px; height: 14px; }
#url { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 13.5px; user-select: text; }
#url::placeholder { color: var(--dim); }
#urlview { position: absolute; pointer-events: none; font-size: 13.5px; white-space: nowrap; overflow: hidden; }
#urlview .p { color: var(--dim); }
.urlwrap { flex: 1; min-width: 0; position: relative; display: flex; align-items: center; }
.urlwrap.show-view #url { color: transparent; }
#tools { display: flex; align-items: center; gap: 2px; flex: none; }
.sep { width: 2px; height: 20px; background: var(--accent); margin: 0 6px; border-radius: 1px; box-shadow: 0 0 6px var(--accent); }
.badge { position: relative; }
.badge i { position: absolute; top: 2px; right: 2px; min-width: 14px; height: 13px; padding: 0 3px; border-radius: 7px; background: var(--accent);
  color: #fff; font: 700 9px/13px system-ui; font-style: normal; text-align: center; }
.badge i:empty { display: none; }
.nb.on { color: var(--accent); background: var(--hover); }
#ram { font-size: 11px; color: var(--dim); padding: 0 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
#ram b { color: var(--text); font-weight: 600; }
#notice { display: none; align-items: center; gap: 8px; max-width: 40%; height: 26px; padding: 0 4px 0 10px; border-radius: 5px;
  background: #2b1d10; color: #ffcf8a; font-size: 12px; white-space: nowrap; flex: none; }
#notice.show { display: flex; }
#notice span { overflow: hidden; text-overflow: ellipsis; }
#notice button { padding: 3px 8px; border-radius: 4px; background: #ffb02033; font-size: 11px; }
#notice button:hover { background: #ffb02066; }

/* ---------- Panneau latéral droit ---------- */
#panel { position: fixed; right: var(--border); top: var(--top); bottom: var(--border); width: var(--panel); background: var(--panel-bg);
  border-left: 1px solid var(--line); padding: 16px; overflow-y: auto; display: none; }
#panel.show { display: block; }
#panel h2 { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
#panel h2::before { content: ""; width: 3px; height: 14px; background: var(--accent); border-radius: 2px; }
#panel h3 { font-size: 10.5px; color: var(--dim); text-transform: uppercase; letter-spacing: 1.4px; margin: 18px 0 8px; font-weight: 600; }
.card { background: #1a1a1d; border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; }
.gauge { display: flex; align-items: center; gap: 14px; }
.ring { width: 66px; height: 66px; flex: none; position: relative; }
.ring svg { width: 66px; height: 66px; transform: rotate(-90deg); }
.ring circle { stroke-width: 6; fill: none; }
.ring .bgc { stroke: var(--line); }
.ring .fg { stroke: var(--accent); transition: stroke-dashoffset .6s; }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-variant-numeric: tabular-nums; }
.gauge .lbl { font-size: 10.5px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
.gauge .val { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; }
.row + .row { border-top: 1px solid var(--line); }
.row small { display: block; color: var(--dim); font-size: 11px; }
.sw { width: 34px; height: 20px; border-radius: 10px; background: #34343a; position: relative; flex: none; transition: .15s; }
.sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: #c9c9cf; transition: .15s; }
.sw.on { background: var(--accent); }
.sw.on::after { left: 17px; background: #fff; }
input[type=range] { width: 100%; accent-color: var(--accent); }
select, .txt { width: 100%; height: 30px; padding: 0 10px; background: #0e0e10; color: var(--text); border: 1px solid var(--line); border-radius: 5px; font: inherit; outline: 0; }
select:focus, .txt:focus { border-color: var(--accent); }
.big { font-size: 32px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 28px; height: 28px; border-radius: 6px; border: 2px solid transparent; }
.swatch.on { border-color: var(--text); }
.btn { width: 100%; height: 32px; border-radius: 5px; background: #1a1a1d; margin-top: 4px; }
.btn:hover { background: var(--accent); color: #fff; }
.tlist .row { font-size: 12px; }
.tlist .row span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.pill { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: var(--line); color: var(--dim); flex: none; }
.pill.live { background: color-mix(in srgb, var(--accent) 25%, transparent); color: var(--text); }
.mini-btn { font-size: 11px; color: var(--dim); padding: 2px 6px; border-radius: 4px; }
.mini-btn:hover { color: var(--accent); }
#bg { position: fixed; left: var(--border); top: var(--top); right: var(--border); bottom: var(--border); background: #18181b; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="frame"></div>
<div class="rz n" data-dir="n"></div><div class="rz s" data-dir="s"></div><div class="rz e" data-dir="e"></div><div class="rz w" data-dir="w"></div>
<div class="rz nw" data-dir="nw"></div><div class="rz ne" data-dir="ne"></div><div class="rz sw" data-dir="sw"></div><div class="rz se" data-dir="se"></div>

<header>
  <div id="titlebar">
    <div id="logo" title="Ferrox"><svg viewBox="0 0 24 24"><path d="M12 2.5l8.2 4.75v9.5L12 21.5l-8.2-4.75v-9.5z"/><path d="M9.5 8h5M9.5 8v8M9.5 12h4"/></svg></div>
    <button class="tb-ic" id="privbtn" title="Onglet privé (Ctrl+Maj+N)">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 12.5a2 2 0 1 0 4 0 2 2 0 1 0-4 0M13 12.5a2 2 0 1 0 4 0 2 2 0 1 0-4 0M11 12.5h2"/></svg>
    </button>
    <div id="tabs"></div>
    <div id="drag"></div>
    <div id="winctl">
      <button class="wc" id="wsearch" title="Rechercher"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg></button>
      <button class="wc" id="wmin" title="Réduire"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button class="wc" id="wmax" title="Agrandir"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1.5"/></svg></button>
      <button class="wc close" id="wclose" title="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>

  <div id="bar">
    <button class="nb acc" id="back" title="Précédent"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <button class="nb off" id="fwd" title="Suivant"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <button class="nb" id="reload" title="Recharger (Ctrl+R)"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9L20 8.5"/><path d="M20 3.5v5h-5"/></svg></button>
    <div id="urlbox">
      <span id="lock"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
      <div class="urlwrap"><span id="urlview"></span><input id="url" spellcheck="false" autocomplete="off" placeholder="Rechercher ou saisir une adresse"></div>
    </div>
    <div id="notice"><span id="noticetxt"></span><button id="noticeact"></button><button id="noticex">✕</button></div>
    <div id="tools">
      <button class="nb" id="home" title="Accueil"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>
      <button class="nb badge" data-panel="shield" title="Bouclier — bloqueur & vie privée"><svg viewBox="0 0 24 24"><path d="M12 21.5s8-3.8 8-9.8V5.2L12 2.5 4 5.2v6.5c0 6 8 9.8 8 9.8z"/></svg><i id="pageblocked"></i></button>
      <span class="sep"></span>
      <button class="nb" data-panel="control" title="Control — RAM / CPU"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1.5v2.5M15 1.5v2.5M9 20v2.5M15 20v2.5M1.5 9H4M1.5 15H4M20 9h2.5M20 15h2.5"/></svg></button>
      <span id="ram" title="Mémoire utilisée par Ferrox"><b id="miniram">–</b> Mo</span>
      <button class="nb" data-panel="settings" title="Paramètres"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </div>
  </div>
</header>

<aside id="panel"></aside>

<script>
'use strict';
(() => {
  const $ = (s) => document.querySelector(s);
  const send = (o) => window.ipc.postMessage(JSON.stringify(o));
  const h = (tag, props = {}, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === 'class') e.className = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    }
    for (const k of kids) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
    return e;
  };
  const icon = (d) => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 24 24');
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', d); s.append(p); return s; };
  const ICON_X = 'M18 6L6 18M6 6l12 12', ICON_MOON = 'M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z',
        ICON_GLOBE = 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20',
        ICON_EYE = 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM3 3l18 18';

  let S = null, editingUrl = false;

  // --------- Onglets
  function renderTabs() {
    const box = $('#tabs'); box.replaceChildren();
    for (const t of S.tabs) {
      const ic = h('span', { class: 'ic' });
      if (t.loading) ic.append(h('span', { class: 'spin' }));
      else ic.append(icon(t.sleeping ? ICON_MOON : t.private ? ICON_EYE : ICON_GLOBE));
      box.append(h('div', {
        class: 'tab' + (t.active ? ' active' : '') + (t.sleeping ? ' sleeping' : '') + (t.private ? ' private' : ''),
        title: t.title + (t.sleeping ? ' (en veille)' : ''),
        onmousedown: (e) => { if (e.button === 1) { e.preventDefault(); send({ cmd: 'close', id: t.id }); } },
        onclick: () => send({ cmd: 'switch', id: t.id }),
      }, ic, h('span', { class: 't' }, t.title || 'Sans titre'),
         h('button', { class: 'x', title: 'Fermer (Ctrl+W)', onclick: (e) => { e.stopPropagation(); send({ cmd: 'close', id: t.id }); } }, icon(ICON_X))));
    }
    box.append(h('button', { id: 'newtab', title: 'Nouvel onglet (Ctrl+T)', onclick: () => send({ cmd: 'new_tab', private: false }) }, icon('M12 5v14M5 12h14')));
  }

  // --------- Barre de navigation
  function renderUrlView(u) {
    const v = $('#urlview'); v.replaceChildren();
    if (!u) return;
    try {
      const x = new URL(u);
      v.append(h('span', {}, x.host), h('span', { class: 'p' }, (x.pathname === '/' ? '' : x.pathname) + x.search));
    } catch (_) { v.append(h('span', {}, u)); }
  }
  function renderBar() {
    const t = S.tabs.find((x) => x.active) || {};
    if (!editingUrl) $('#url').value = t.url || '';
    renderUrlView(editingUrl ? '' : t.url);
    $('.urlwrap').classList.toggle('show-view', !editingUrl && !!t.url);
    const lock = $('#lock');
    lock.classList.toggle('insecure', !!t.url && !t.url.startsWith('https://'));
    lock.style.opacity = t.url ? 1 : .4;
    lock.title = t.url && t.url.startsWith('https://') ? 'Connexion chiffrée (HTTPS)' : 'Connexion non chiffrée';
    $('#pageblocked').textContent = t.blocked ? (t.blocked > 99 ? '99+' : t.blocked) : '';
    $('#miniram').textContent = S.usage.ram || '–';
    document.body.classList.toggle('max', !!S.maximized);
    const n = S.notice, nb = $('#notice');
    nb.classList.toggle('show', !!n);
    if (n) {
      const act = $('#noticeact'); act.style.display = 'none'; act.onclick = null;
      let host = ''; try { host = new URL(n.url).host; } catch (_) { host = n.url; }
      if (n.kind === 'http') {
        $('#noticetxt').textContent = 'HTTP non sécurisé bloqué : ' + host;
        act.textContent = 'Autoriser ce site'; act.style.display = '';
        act.onclick = () => send({ cmd: 'allow_http', url: n.url });
      } else if (n.kind === 'blocked') $('#noticetxt').textContent = 'Traqueur bloqué : ' + host;
      else if (n.kind === 'download') $('#noticetxt').textContent = 'Téléchargement en cours…';
      else if (n.kind === 'download_done') $('#noticetxt').textContent = 'Téléchargement terminé (dossier Téléchargements)';
      else if (n.kind === 'cleared') $('#noticetxt').textContent = 'Données de navigation effacées';
    }
    document.querySelectorAll('[data-panel]').forEach((b) => b.classList.toggle('on', b.dataset.panel === S.panel));
  }

  // --------- Panneaux
  const ring = (pct, label) => {
    const C = 2 * Math.PI * 27, v = Math.max(0, Math.min(1, pct));
    const wrap = h('div', { class: 'ring' });
    wrap.innerHTML = `<svg viewBox="0 0 66 66"><circle class="bgc" cx="33" cy="33" r="27"/><circle class="fg" cx="33" cy="33" r="27" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - v)}"/></svg>`;
    wrap.append(h('b', {}, label));
    return wrap;
  };
  const toggle = (key, title, sub) => h('div', { class: 'row' },
    h('div', {}, title, h('small', {}, sub)),
    h('button', { class: 'sw' + (S.settings[key] ? ' on' : ''), onclick: () => setS({ [key]: !S.settings[key] }) }));
  const slider = (key, title, min, max, step, fmt) => {
    const out = h('span', { class: 'pill live' }, fmt(S.settings[key]));
    const inp = h('input', { type: 'range', min, max, step });
    inp.value = S.settings[key];
    inp.addEventListener('input', () => { out.textContent = fmt(+inp.value); });
    inp.addEventListener('change', () => setS({ [key]: +inp.value }));
    return h('div', { class: 'row', style: 'display:block' }, h('div', { class: 'row', style: 'padding:0 0 6px' }, h('span', {}, title), out), inp);
  };
  const setS = (patch) => send({ cmd: 'settings', settings: { ...S.settings, ...patch } });

  function panelControl(p) {
    const lim = S.settings.ram_limit_mb, ram = S.usage.ram;
    p.append(h('h2', {}, 'Control'),
      h('div', { class: 'card gauge' }, ring(ram / lim, Math.round(100 * ram / lim) + '%'),
        h('div', {}, h('div', { class: 'lbl' }, 'Mémoire'), h('div', { class: 'val' }, ram + ' Mo'), h('small', { style: 'color:var(--dim)' }, 'limite ' + lim + ' Mo'))),
      h('div', { class: 'card gauge' }, ring(S.usage.cpu / 100, Math.round(S.usage.cpu) + '%'),
        h('div', {}, h('div', { class: 'lbl' }, 'Processeur'), h('div', { class: 'val' }, S.usage.cpu.toFixed(1) + ' %'), h('small', { style: 'color:var(--dim)' }, S.usage.procs + ' processus'))),
      h('h3', {}, 'Limiteur de RAM'),
      h('div', { class: 'card' },
        toggle('ram_limiter', 'Limiteur actif', 'Met en veille les onglets en arrière-plan'),
        slider('ram_limit_mb', 'Limite', 256, 8192, 128, (v) => v + ' Mo'),
        slider('max_live_tabs', 'Onglets actifs max', 1, 20, 1, (v) => v),
        slider('hibernate_after_min', 'Veille après inactivité', 0, 60, 1, (v) => v ? v + ' min' : 'jamais')),
      h('h3', {}, 'Onglets'));
    const list = h('div', { class: 'card tlist' });
    for (const t of S.tabs) list.append(h('div', { class: 'row' }, h('span', {}, t.title),
      h('span', { class: 'pill' + (t.sleeping ? '' : ' live') }, t.sleeping ? 'veille' : 'actif'),
      (!t.active && !t.sleeping && !t.private) ? h('button', { class: 'mini-btn', onclick: () => send({ cmd: 'sleep', id: t.id }) }, 'Endormir') : ''));
    p.append(list);
  }

  function panelShield(p) {
    p.append(h('h2', {}, 'Bouclier'),
      h('div', { class: 'card' }, h('div', { class: 'big' }, S.blocked_total.toLocaleString('fr-FR')),
        h('small', { style: 'color:var(--dim)' }, 'publicités & traqueurs bloqués cette session · ' + S.blocklist.toLocaleString('fr-FR') + ' domaines en liste')),
      h('div', { class: 'card' },
        toggle('adblock', 'Bloqueur pubs & traqueurs', 'S\'applique aux pages rechargées'),
        toggle('https_only', 'Mode HTTPS uniquement', 'Bloque les connexions non chiffrées'),
        toggle('block_permissions', 'Bloquer caméra / micro / position', 'Refus automatique des permissions'),
        toggle('anti_fingerprint', 'Anti-empreinte strict', 'Désactive WebGL et WebAudio')),
      h('div', { class: 'card' }, h('small', { style: 'color:var(--dim)' },
        'Toujours actifs : Global Privacy Control, Do-Not-Track, pas de préchargement DNS, popups → onglets, schémas file:// et javascript: refusés, ITP (Linux), processus web isolés (sandbox bubblewrap si installé).')),
      h('button', { class: 'btn', onclick: () => send({ cmd: 'clear_data' }) }, 'Effacer cookies & données de navigation'));
  }

  function panelSettings(p) {
    const colors = ['#fa1e4e', '#a855f7', '#22d3ee', '#3ddc97', '#ff8a00', '#f5f5f5'];
    const sw = h('div', { class: 'swatches' });
    for (const c of colors) sw.append(h('button', { class: 'swatch' + (S.settings.accent === c ? ' on' : ''), style: 'background:' + c, onclick: () => setS({ accent: c }) }));
    const engines = { 'DuckDuckGo': 'https://duckduckgo.com/?q={}', 'Brave Search': 'https://search.brave.com/search?q={}', 'Startpage': 'https://www.startpage.com/do/search?q={}', 'Qwant': 'https://www.qwant.com/?q={}', 'Google': 'https://www.google.com/search?q={}' };
    const sel = h('select', { onchange: (e) => setS({ search_url: e.target.value }) });
    for (const [n, u] of Object.entries(engines)) { const o = h('option', { value: u }, n); if (u === S.settings.search_url) o.selected = true; sel.append(o); }
    const home = h('input', { class: 'txt', placeholder: 'ferrox://home ou https://…' });
    home.value = S.settings.home_url;
    home.addEventListener('change', () => setS({ home_url: home.value.trim() || 'ferrox://home' }));
    p.append(h('h2', {}, 'Paramètres'),
      h('h3', {}, 'Couleur d\'accent'), h('div', { class: 'card' }, sw),
      h('h3', {}, 'Moteur de recherche'), h('div', { class: 'card' }, sel),
      h('h3', {}, 'Page d\'accueil'), h('div', { class: 'card' }, home),
      h('h3', {}, 'Raccourcis'),
      h('div', { class: 'card' }, ...[['Ctrl+T', 'Nouvel onglet'], ['Ctrl+Maj+N', 'Onglet privé'], ['Ctrl+W', 'Fermer l\'onglet'], ['Ctrl+L', 'Barre d\'adresse'], ['Ctrl+R', 'Recharger'], ['Ctrl+Tab', 'Onglet suivant']]
        .map(([k, d]) => h('div', { class: 'row' }, h('span', {}, d), h('span', { class: 'pill' }, k)))));
  }

  function renderPanel() {
    const p = $('#panel');
    const active = document.activeElement;
    if (active && p.contains(active) && active.matches('input, select')) return; // ne pas casser une saisie en cours
    p.classList.toggle('show', !!S.panel);
    p.replaceChildren();
    if (S.panel === 'control') panelControl(p);
    else if (S.panel === 'shield') panelShield(p);
    else if (S.panel === 'settings') panelSettings(p);
  }

  window.fx = {
    render(state) {
      S = state;
      const r = document.documentElement.style;
      r.setProperty('--accent', S.settings.accent);
      r.setProperty('--top', S.layout.top + 'px');
      r.setProperty('--border', S.layout.border + 'px');
      r.setProperty('--panel', S.layout.panel + 'px');
      renderTabs(); renderBar(); renderPanel();
    },
    focusUrl() { const u = $('#url'); u.focus(); u.select(); },
  };

  // --------- Interactions
  const url = $('#url');
  url.addEventListener('focus', () => { editingUrl = true; if (S) renderBar(); setTimeout(() => url.select(), 0); });
  url.addEventListener('blur', () => { editingUrl = false; if (S) renderBar(); });
  url.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { send({ cmd: 'navigate', input: url.value }); url.blur(); }
    if (e.key === 'Escape') url.blur();
  });
  $('#back').onclick = () => send({ cmd: 'back' });
  $('#fwd').onclick = () => send({ cmd: 'forward' });
  $('#reload').onclick = () => send({ cmd: 'reload' });
  $('#home').onclick = () => send({ cmd: 'home' });
  $('#privbtn').onclick = () => send({ cmd: 'new_tab', private: true });
  $('#wsearch').onclick = () => fx.focusUrl();
  $('#wmin').onclick = () => send({ cmd: 'minimize' });
  $('#wmax').onclick = () => send({ cmd: 'maximize' });
  $('#wclose').onclick = () => send({ cmd: 'quit' });
  $('#noticex').onclick = () => { $('#notice').classList.remove('show'); };
  document.querySelectorAll('[data-panel]').forEach((b) => b.onclick = () => send({ cmd: 'panel', name: b.dataset.panel }));
  document.querySelectorAll('.rz').forEach((z) => z.addEventListener('mousedown', (e) => {
    if (e.button === 0) { e.preventDefault(); send({ cmd: 'resize', dir: z.dataset.dir }); }
  }));

  // Déplacement de la fenêtre : zones vides de la barre d'onglets.
  const isDragZone = (el) => el && (el.id === 'titlebar' || el.id === 'tabs' || el.id === 'drag' || !!el.closest('#logo'));
  $('#titlebar').addEventListener('mousedown', (e) => {
    if (e.button === 0 && isDragZone(e.target) && e.detail === 1) send({ cmd: 'drag' });
  });
  $('#titlebar').addEventListener('dblclick', (e) => { if (isDragZone(e.target)) send({ cmd: 'maximize' }); });

  addEventListener('keydown', (e) => {
    if (!e.ctrlKey) return;
    const k = e.key.toLowerCase();
    if (k === 't' && !e.shiftKey) { e.preventDefault(); send({ cmd: 'new_tab', private: false }); }
    if (k === 'n' && e.shiftKey) { e.preventDefault(); send({ cmd: 'new_tab', private: true }); }
    if (k === 'l') { e.preventDefault(); fx.focusUrl(); }
    if (k === 'r') { e.preventDefault(); send({ cmd: 'reload' }); }
    if (k === 'w') { e.preventDefault(); const t = S && S.tabs.find((x) => x.active); if (t) send({ cmd: 'close', id: t.id }); }
  });
  addEventListener('contextmenu', (e) => { if (e.target !== url) e.preventDefault(); });
  send({ cmd: 'ready' });
})();
</script>
</body>
</html>
