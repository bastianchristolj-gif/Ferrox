<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: https:">
<title>Ferrox</title>
<style>
:root {
  --accent: #fa1e4e;
  --accent-dk: color-mix(in srgb, var(--accent) 58%, #000);
  --accent-glow: color-mix(in srgb, var(--accent) 45%, transparent);
  --frame: #0c0c0e;      /* barre d'onglets */
  --bar: #18181b;        /* barre de navigation */
  --field: #0a0a0c;      /* champ d'adresse */
  --panel-bg: #121214;
  --card: #1a1a1d;
  --hover: #26262b;
  --line: #2c2c32;
  --text: #f4f4f6;
  --dim: #9a9aa3;
  --top: 74px; --border: 3px; --panel: 320px;
  --ease: cubic-bezier(.22, 1, .36, 1);      /* easeOutQuint : rapide puis très doux */
  --spring: cubic-bezier(.3, 1.35, .5, 1);   /* léger rebond */
  --radius: 0px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--frame); color: var(--text);
  font: 12.5px/1.35 "Segoe UI Variable Text", "Segoe UI", "Inter", "Cantarell", system-ui, sans-serif; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; outline: none; }
button:focus-visible { box-shadow: 0 0 0 2px var(--accent-glow); }
svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }

/* Liseré d'accent + zones de redimensionnement (fenêtre sans bordure) */
#frame { position: fixed; inset: 0; pointer-events: none; z-index: 5; border-radius: var(--radius);
  border: 1px solid color-mix(in srgb, var(--accent) 80%, #000);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 22%, transparent), inset 0 0 7px color-mix(in srgb, var(--accent) 55%, transparent);
  transition: border-color .4s var(--ease), box-shadow .4s var(--ease); }
html, body { border-radius: var(--radius); }
body.max #frame, body.max .rz { display: none; }
.rz { position: fixed; z-index: 6; background: transparent; }
.rz[data-dir=n]  { top: 0; left: 8px; right: 8px; height: 3px; cursor: n-resize; }
.rz[data-dir=s]  { bottom: 0; left: 8px; right: 8px; height: 3px; cursor: s-resize; }
.rz[data-dir=w]  { left: 0; top: 8px; bottom: 8px; width: 3px; cursor: w-resize; }
.rz[data-dir=e]  { right: 0; top: 8px; bottom: 8px; width: 3px; cursor: e-resize; }
.rz[data-dir=nw] { left: 0; top: 0; width: 8px; height: 8px; cursor: nw-resize; }
.rz[data-dir=ne] { right: 0; top: 0; width: 8px; height: 8px; cursor: ne-resize; }
.rz[data-dir=sw] { left: 0; bottom: 0; width: 8px; height: 8px; cursor: sw-resize; }
.rz[data-dir=se] { right: 0; bottom: 0; width: 8px; height: 8px; cursor: se-resize; }

/* ---------- Rangée 1 : logo + onglets + contrôles fenêtre ---------- */
#titlebar { height: 36px; display: flex; align-items: center; padding: 0 4px 0 6px; background: var(--frame); }
#logo { width: 32px; height: 32px; display: grid; place-items: center; color: var(--accent); flex: none; }
#logo svg { width: 22px; height: 22px; stroke-width: 2.2; transition: filter .3s, transform .4s var(--spring);
  filter: drop-shadow(0 0 3px var(--accent-glow)); }
#logo:hover svg { filter: drop-shadow(0 0 8px var(--accent)); transform: rotate(60deg); }
.tb-ic { width: 30px; height: 28px; display: grid; place-items: center; color: var(--dim); border-radius: 6px; flex: none;
  transition: color .15s, background .15s, transform .12s; }
.tb-ic:hover { color: var(--text); background: var(--hover); }
.tb-ic:active, .nb:active, .wc:active, #newtab:active { transform: scale(.88); }

#tabs { flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; gap: 4px; padding: 0 6px; overflow: hidden; position: relative; }
#glider { position: absolute; left: 0; top: 4px; height: 28px; width: 0; border-radius: 6px; pointer-events: none; z-index: 0; opacity: 0;
  background: var(--accent-dk); box-shadow: 0 2px 14px -4px var(--accent-glow), inset 0 1px 0 #ffffff1f;
  transition: transform .42s var(--spring), width .42s var(--spring), opacity .25s, background .4s; will-change: transform, width; }
#glider.ready { opacity: 1; }
#tabs > .tab, #newtab { position: relative; z-index: 1; }
.tab { height: 28px; min-width: 0; max-width: 200px; flex: 1 1 190px; display: flex; align-items: center; gap: 7px;
  padding: 0 6px 0 10px; border-radius: 6px; background: transparent; color: var(--text); cursor: default; overflow: hidden;
  transition: background .2s var(--ease), box-shadow .25s var(--ease), color .2s; }
.tab:hover { background: var(--hover); }
.tab.active, .tab.active:hover { background: transparent; }
.tab.active:hover { background: #ffffff0f; }
body.noglide .tab.active { background: var(--accent-dk); }
.tab.sleeping:not(.active) { color: var(--dim); }
.tab.private:not(.active) { box-shadow: inset 0 -2px 0 #8b5cf6; }
.tab.enter { animation: tabIn .38s var(--ease) both; }
.tab.leave { position: absolute !important; animation: tabOut .22s var(--ease) forwards; pointer-events: none; }
@keyframes tabIn { from { opacity: 0; transform: translateY(8px) scale(.92); } }
@keyframes tabOut { to { opacity: 0; transform: translateY(6px) scale(.88); } }
.tab .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); }
.tab .ic { width: 14px; height: 14px; flex: none; display: grid; place-items: center; }
.tab .ic svg { width: 14px; height: 14px; animation: fadeIn .2s; }
.tab.active .ic { color: #fff; }
.tab .x { width: 18px; height: 18px; border-radius: 4px; display: grid; place-items: center; flex: none;
  opacity: 0; transform: scale(.6); transition: opacity .15s, transform .2s var(--spring), background .15s; }
.tab:hover .x, .tab.active .x { opacity: .8; transform: none; }
.tab .x:hover { opacity: 1; background: #ffffff26; }
.tab .x svg { width: 11px; height: 11px; }
.spin { width: 12px; height: 12px; border: 2px solid #ffffff33; border-top-color: #fff; border-radius: 50%; animation: s .7s linear infinite; }
@keyframes s { to { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity: 0; } }
#newtab { width: 26px; height: 26px; flex: none; display: grid; place-items: center; color: var(--dim); border-radius: 6px;
  transition: color .15s, background .15s, transform .12s; }
#newtab:hover { color: var(--text); background: var(--hover); }
#newtab:hover svg { transform: rotate(90deg); }
#newtab svg { transition: transform .3s var(--spring); }
#drag { flex: 0 0 40px; height: 100%; }
#winctl { display: flex; align-items: center; gap: 2px; flex: none; }
.wc { width: 36px; height: 28px; display: grid; place-items: center; color: var(--accent); border-radius: 6px;
  transition: background .15s, color .15s, transform .12s; }
.wc:hover { background: var(--hover); }
.wc.close:hover { background: var(--accent); color: #fff; }
.wc svg { width: 15px; height: 15px; }

/* ---------- Rangée 2 : navigation ---------- */
#bar { height: 38px; display: flex; align-items: center; gap: 4px; padding: 0 8px; background: var(--bar);
  border-bottom: 1px solid #000; }
.nb { width: 30px; height: 30px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center;
  color: var(--text); flex: none; transition: color .15s, background .15s, transform .12s; }
.nb:hover { background: var(--hover); }
.nb.acc { color: var(--accent); }
.nb.off { color: #55555c; pointer-events: none; }
.nb.on { color: var(--accent); background: var(--hover); }
#reload.turn svg { animation: s .5s var(--ease); }
#urlbox { flex: 1; min-width: 0; height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 12px; margin: 0 6px;
  background: var(--field); border: 1px solid var(--line); border-radius: 8px;
  transition: border-color .2s, box-shadow .25s var(--ease), background .2s; }
#urlbox:hover { border-color: #3c3c44; }
#urlbox:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
#lock { color: #3ddc97; display: grid; place-items: center; flex: none; transition: color .2s, opacity .2s; }
#lock.insecure { color: #ffb020; }
#lock svg { width: 14px; height: 14px; }
.urlwrap { flex: 1; min-width: 0; height: 100%; position: relative; display: flex; align-items: center; }
#url { contain: paint; width: 100%; height: 100%; background: none; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 13.5px; user-select: text; }
#url::placeholder { color: #85858e; }
#urlview { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); pointer-events: none;
  font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
#urlview .p { color: var(--dim); }
.urlwrap.show-view #url { color: transparent; }
#tools { display: flex; align-items: center; gap: 4px; flex: none; height: 100%; }
.sep { width: 2px; height: 18px; background: var(--accent); margin: 0 4px; border-radius: 1px; box-shadow: 0 0 6px var(--accent); flex: none; }
.badge { position: relative; }
.badge i { position: absolute; top: 1px; right: 0; min-width: 15px; height: 14px; padding: 0 3px; border-radius: 7px; background: var(--accent);
  color: #fff; font: 700 9px/14px system-ui; font-style: normal; text-align: center; box-shadow: 0 0 0 2px var(--bar); }
.badge i:empty { display: none; }
.badge i.pop { animation: pop .35s var(--spring); }
@keyframes pop { 0% { transform: scale(.4); } 100% { transform: none; } }
#ram { height: 30px; display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--dim); padding: 0 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
#ram b { color: var(--text); font-weight: 600; }
#notice { display: none; align-items: center; gap: 8px; max-width: 40%; height: 28px; padding: 0 4px 0 10px; border-radius: 7px;
  background: #2b1d10; color: #ffcf8a; font-size: 12px; white-space: nowrap; flex: none; }
#notice.show { display: flex; animation: slideDown .3s var(--spring); }
@keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } }
#notice span { overflow: hidden; text-overflow: ellipsis; }
#notice button { height: 22px; padding: 0 8px; border-radius: 5px; background: #ffb02033; font-size: 11px; transition: background .15s; }
#notice button:hover { background: #ffb02066; }

/* ---------- Panneau latéral droit ---------- */
#panel { position: fixed; right: var(--border); top: var(--top); bottom: var(--border); width: var(--panel); background: var(--panel-bg);
  border-left: 1px solid var(--line); padding: 16px; overflow-y: auto; overflow-x: hidden; display: none; }
#panel.show { display: block; }
#panel.anim { animation: panelIn .42s var(--ease); }
#panel.anim > * { animation: fadeUp .5s var(--ease) both; }
#panel.anim > *:nth-child(2) { animation-delay: .04s; } #panel.anim > *:nth-child(3) { animation-delay: .08s; }
#panel.anim > *:nth-child(4) { animation-delay: .12s; } #panel.anim > *:nth-child(5) { animation-delay: .16s; }
#panel.anim > *:nth-child(n+6) { animation-delay: .2s; }
@keyframes panelIn { from { transform: translateX(28px); opacity: 0; } }
@keyframes fadeUp { from { transform: translateY(10px); opacity: 0; } }
#panel::-webkit-scrollbar { width: 8px; } #panel::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
#panel h2 { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
#panel h2::before { content: ""; width: 3px; height: 14px; background: var(--accent); border-radius: 2px; box-shadow: 0 0 8px var(--accent); }
#panel h3 { font-size: 10.5px; color: var(--dim); text-transform: uppercase; letter-spacing: 1.4px; margin: 18px 0 8px; font-weight: 600; }
.card { background: var(--card); border: 1px solid #222227; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; transition: border-color .2s; }
.card:hover { border-color: #2e2e35; }
.gauge { display: flex; align-items: center; gap: 14px; }
.ring { width: 66px; height: 66px; flex: none; position: relative; }
.ring svg { width: 66px; height: 66px; transform: rotate(-90deg); }
.ring circle { stroke-width: 6; fill: none; }
.ring .bgc { stroke: var(--line); }
.ring .fg { stroke: var(--accent); transition: stroke-dashoffset .5s var(--ease), stroke .3s; }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-variant-numeric: tabular-nums; }
.gauge .lbl { font-size: 10.5px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
.gauge .val { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; }
.row + .row { border-top: 1px solid var(--line); }
.row small { display: block; color: var(--dim); font-size: 11px; }
.toggle { width: 36px; height: 20px; border-radius: 10px; background: #34343a; position: relative; flex: none; transition: background .25s var(--ease); }
.toggle::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 7px; background: #c9c9cf; will-change: transform;
  transition: transform .38s var(--spring), background .25s, width .2s var(--ease); }
.toggle:active::after { width: 18px; }
.toggle.on { background: var(--accent); box-shadow: 0 0 10px -2px var(--accent-glow); }
.toggle.on::after { transform: translateX(16px); background: #fff; }
.toggle.on:active::after { transform: translateX(12px); }
input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
.txt { width: 100%; height: 34px; padding: 0 12px; background: var(--field); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
  font: inherit; outline: 0; user-select: text; transition: border-color .2s, box-shadow .2s; }
.txt:hover { border-color: #3c3c44; }
.txt:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.big { font-size: 32px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; text-shadow: 0 0 18px var(--accent-glow); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 30px; height: 30px; border-radius: 8px; position: relative; transition: transform .25s var(--spring), box-shadow .2s; }
.swatch:hover { transform: translateY(-2px) scale(1.08); }
.swatch.on { box-shadow: 0 0 0 2px var(--panel-bg), 0 0 0 4px var(--text); }
.btn { width: 100%; height: 34px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); margin-top: 4px;
  transition: background .2s, border-color .2s, transform .12s; }
.btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:active { transform: scale(.98); }
.tlist .row { font-size: 12px; }
.tlist .row > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.pill { font-size: 10px; padding: 2px 7px; border-radius: 5px; background: var(--line); color: var(--dim); flex: none; }
.pill.live { background: color-mix(in srgb, var(--accent) 25%, transparent); color: var(--text); }
.mini-btn { font-size: 11px; color: var(--dim); padding: 2px 6px; border-radius: 4px; transition: color .15s; }
.mini-btn:hover { color: var(--accent); }

/* ---------- Menu déroulant personnalisé ---------- */
.dd { position: relative; }
.dd-btn { width: 100%; height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 12px; text-align: left;
  background: var(--field); border: 1px solid var(--line); border-radius: 8px; transition: border-color .2s, box-shadow .2s, background .2s; }
.dd-btn:hover { border-color: #3c3c44; background: #0f0f12; }
.dd.open .dd-btn { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.dd-btn .dd-val { flex: 1; font-weight: 600; }
.dd-btn .chev { color: var(--dim); transition: transform .25s var(--ease), color .2s; }
.dd.open .dd-btn .chev { transform: rotate(180deg); color: var(--accent); }
.dd-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); flex: none; }
.dd-list { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 20; padding: 5px; border-radius: 10px;
  background: #1c1c20; border: 1px solid #33333a; box-shadow: 0 12px 32px -8px #000c, 0 0 0 1px #0006;
  opacity: 0; transform: translateY(-6px) scale(.97); transform-origin: top center; pointer-events: none; visibility: hidden;
  transition: opacity .16s var(--ease), transform .2s var(--ease), visibility 0s linear .2s; }
.dd.open .dd-list { opacity: 1; transform: none; pointer-events: auto; visibility: visible; transition: opacity .16s var(--ease), transform .22s var(--spring); }
.dd-item { width: 100%; height: 34px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 7px; text-align: left;
  color: var(--text); transition: background .15s; }
.dd-item:hover, .dd-item.kb { background: var(--hover); }
.dd-item > span:first-child { transition: transform .25s var(--ease); }
.dd-item:hover > span:first-child, .dd-item.kb > span:first-child { transform: translateX(4px); }
.dd-item small { color: var(--dim); font-size: 11px; margin-left: auto; }
.dd-item .ck { width: 14px; height: 14px; color: var(--accent); opacity: 0; transform: scale(.5); transition: opacity .15s, transform .2s var(--spring); }
.dd-item.sel { color: #fff; }
.dd-item.sel .ck { opacity: 1; transform: none; }
.dd-item.sel::before { content: ""; position: absolute; left: 6px; width: 3px; height: 16px; border-radius: 2px; background: var(--accent); }
.dd-item { position: relative; }

/* ---------- Thèmes ---------- */
body.noanim *, body.noanim *::before, body.noanim *::after { animation: none !important; transition: none !important; }
body.noram #ram { display: none; }
#tabs .tab .ic.pg { color: var(--accent); }
.tab.active .ic.pg { color: #fff; }

/* ---------- Pages internes (Paramètres / Extensions) ---------- */
#page { position: fixed; left: var(--border); top: var(--top); right: var(--pr, var(--border)); bottom: var(--border); overflow: hidden;
  background: radial-gradient(ellipse 80% 60% at 50% 110%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 70%), var(--page-bg); display: none; }
#page.show { display: block; }
#page.anim .pg-top, #page.anim .pg-side, #page.anim .pg-main > * { animation: fadeUp .55s var(--ease) both; }
#page.anim .pg-side { animation-name: slideRight; }
#page.anim .pg-main > *:nth-child(2) { animation-delay: .05s; } #page.anim .pg-main > *:nth-child(3) { animation-delay: .1s; }
#page.anim .pg-main > *:nth-child(n+4) { animation-delay: .15s; }
@keyframes slideRight { from { opacity: 0; transform: translateX(-16px); } }
.pg-grid { position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background-image: linear-gradient(#ffffff07 1px, transparent 1px), linear-gradient(90deg, #ffffff07 1px, transparent 1px); background-size: 56px 56px;
  -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 55%, #000 100%); mask-image: linear-gradient(180deg, transparent, #000 55%); }
.pg-scroll { position: absolute; inset: 0; overflow-y: auto; scroll-behavior: smooth; }
.pg-scroll::-webkit-scrollbar { width: 10px; } .pg-scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; border: 3px solid transparent; background-clip: padding-box; }
.pg-top { display: flex; justify-content: center; align-items: center; gap: 36px; height: 76px; padding: 0 20px; position: sticky; top: 0; z-index: 4;
  background: var(--page-bg); }
.pg-top button { font-size: 14px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--dim); position: relative; padding: 4px 2px;
  transition: color .2s, font-size .25s var(--ease), letter-spacing .25s; }
.pg-top button:hover { color: var(--text); }
.pg-top button.on { color: #fff; font-size: 30px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 0 24px var(--accent-glow); }
.pg-top button.on::after { content: ""; position: absolute; left: 50%; bottom: -4px; width: 40px; height: 3px; margin-left: -20px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.pg-body { display: grid; grid-template-columns: 250px minmax(0, 720px); justify-content: center; gap: 28px; padding: 8px 28px 60px; position: relative; }
.pg-side { position: sticky; top: 76px; align-self: start; background: color-mix(in srgb, var(--panel-bg) 85%, transparent); border: 1px solid var(--line);
  border-radius: 12px; padding: 10px; backdrop-filter: blur(6px); }
.pg-side button { width: 100%; display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 10px; border-radius: 7px; color: var(--dim);
  font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; text-align: left; transition: background .2s, color .2s, box-shadow .25s var(--ease); }
.pg-side button svg { width: 16px; height: 16px; }
.pg-side button > * { transition: transform .25s var(--ease); }
.pg-side button:hover { color: var(--text); background: var(--hover); }
.pg-side button:hover > * { transform: translateX(3px); }
.pg-side button.on { color: var(--text); background: color-mix(in srgb, var(--accent) 14%, var(--card)); box-shadow: inset 3px 0 0 var(--accent); }
.pg-side button.on svg { color: var(--accent); }
.pg-side hr { border: 0; height: 1px; background: var(--line); margin: 6px 4px; }
.pg-search { position: sticky; top: 76px; z-index: 3; outline: 10px solid var(--page-bg); display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px; margin-bottom: 8px;
  background: var(--field); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px -12px #000; transition: border-color .2s, box-shadow .2s; }
.pg-search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent), 0 8px 24px -12px #000; }
.pg-search svg { color: var(--dim); }
.pg-search input { flex: 1; background: none; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 13px; user-select: text; }
.pg-sec { padding-top: 22px; scroll-margin-top: 130px; }
.pg-sec h4 { font-size: 11px; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: 1.3px; margin: 0 2px 10px; display: flex; align-items: center; justify-content: space-between; }
.pg-card { background: color-mix(in srgb, var(--card) 92%, transparent); border: 1px solid #ffffff0d; border-radius: 12px; padding: 6px 18px; transition: border-color .2s; }
.pg-card:hover { border-color: #ffffff17; }
.pg-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; min-height: 52px; padding: 10px 0; }
.pg-row + .pg-row { border-top: 1px solid #ffffff0b; }
.pg-row .lab { font-size: 13px; } .pg-row .lab small { display: block; color: var(--dim); font-size: 11.5px; margin-top: 2px; max-width: 460px; }
.pg-row .ctl { flex: none; min-width: 0; }
.pg-row .ctl .dd { width: 230px; }
.pg-row.hide, .pg-sec.hide { display: none; }
.themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; padding: 12px 0 14px; }
.theme { display: flex; flex-direction: column; gap: 8px; text-align: left; }
.theme .pv { height: 84px; border-radius: 8px; position: relative; overflow: hidden; border: 1px solid #ffffff12;
  transition: transform .25s var(--spring), box-shadow .25s, border-color .2s; }
.theme .pv::before { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, transparent 55%, color-mix(in srgb, var(--c) 25%, transparent)); }
.theme .pv i { position: absolute; left: 10px; width: 7px; height: 7px; border-radius: 1px; background: var(--c); box-shadow: 0 0 6px var(--c); }
.theme .pv i:nth-child(1) { top: 12px; } .theme .pv i:nth-child(2) { top: 26px; } .theme .pv i:nth-child(3) { top: 40px; }
.theme .pv b { position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--c); }
.theme:hover .pv { transform: translateY(-3px); box-shadow: 0 10px 20px -10px var(--c); }
.theme.on .pv { border-color: var(--c); box-shadow: 0 0 0 1px var(--c), 0 10px 24px -12px var(--c); }
.theme .nm { display: flex; align-items: center; justify-content: space-between; font-size: 12px; padding: 0 2px; }
.radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #8a8a92; display: grid; place-items: center; flex: none; transition: border-color .2s; }
.radio::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); transform: scale(0); transition: transform .25s var(--spring); }
.on > .nm .radio, .radio.on { border-color: var(--accent); } .on > .nm .radio::after, .radio.on::after { transform: scale(1); }
.colorpick { width: 30px; height: 30px; border-radius: 8px; overflow: hidden; position: relative; border: 1px dashed #6a6a72; cursor: pointer; }
.colorpick input { position: absolute; inset: -6px; width: 44px; height: 44px; border: 0; padding: 0; cursor: pointer; opacity: 0; }
.colorpick span { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 16px; pointer-events: none; }
.kbd { font: 600 11px/1 ui-monospace, Consolas, monospace; padding: 5px 8px; border-radius: 6px; background: var(--field); border: 1px solid var(--line); border-bottom-width: 2px; color: var(--text); }
.btn2 { height: 34px; padding: 0 16px; border-radius: 8px; background: var(--accent); color: var(--on-accent); font-weight: 600; transition: filter .2s, transform .12s, box-shadow .2s; white-space: nowrap; }
.btn2:hover { filter: brightness(1.12); box-shadow: 0 6px 18px -8px var(--accent); } .btn2:active { transform: scale(.96); }
.btn2.ghost { background: var(--field); color: var(--text); border: 1px solid var(--line); }

.mono { font: 11.5px ui-monospace, Consolas, monospace; color: var(--dim); user-select: text; word-break: break-all; }

/* Extensions */
.ext-install { display: flex; gap: 10px; padding: 14px 0; }
.ext-install .txt { flex: 1; }
.ext-status { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--dim); padding: 0 0 12px; animation: fadeUp .3s var(--ease); }
.ext-status .spin { border-color: #ffffff22; border-top-color: var(--accent); }
.ext-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.ext { background: var(--card); border: 1px solid #ffffff0d; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px;
  transition: border-color .2s, transform .25s var(--spring), opacity .2s; animation: fadeUp .4s var(--ease) both; }
.ext:hover { border-color: #ffffff1f; transform: translateY(-2px); }
.ext.off { opacity: .55; }
.ext .hd { display: flex; align-items: center; gap: 12px; }
.ext .ico { width: 40px; height: 40px; border-radius: 10px; background: var(--field); display: grid; place-items: center; flex: none; overflow: hidden; color: var(--accent); }
.ext .ico img { width: 32px; height: 32px; }
.ext .nm { flex: 1; min-width: 0; } .ext .nm b { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ext .nm small { color: var(--dim); font-size: 11px; }
.ext p { color: var(--dim); font-size: 12px; line-height: 1.45; min-height: 34px; }
.ext .ft { display: flex; gap: 8px; } .ext .ft .btn2 { height: 30px; padding: 0 12px; font-size: 12px; }
.ext .ft .grow { flex: 1; }
.empty { text-align: center; padding: 34px 10px; color: var(--dim); }
.empty svg { width: 42px; height: 42px; margin: 0 auto 10px; color: var(--accent); opacity: .8; }
.note { font-size: 11.5px; color: var(--dim); line-height: 1.5; padding: 14px 2px; }
.pext { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.pext + .pext { border-top: 1px solid var(--line); }
.pext img, .pext .ph { width: 26px; height: 26px; border-radius: 6px; flex: none; background: var(--field); }
.pext button.n { flex: 1; min-width: 0; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; transition: color .15s; }
.pext button.n:hover { color: var(--accent); }

/* ---------- Correctifs d'interface ---------- */
.tab { container-type: inline-size; }
@container (max-width: 74px) { .tab .t { display: none; } .tab:not(.active) .x { display: none; } }
.tab .ic img { width: 16px; height: 16px; border-radius: 3px; object-fit: contain; animation: fadeIn .25s; }
#loadbar { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; overflow: hidden; opacity: 0; transition: opacity .3s; pointer-events: none; }
#loadbar.on { opacity: 1; }
#loadbar::after { content: ""; position: absolute; top: 0; bottom: 0; width: 35%; border-radius: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent); box-shadow: 0 0 8px var(--accent); animation: lb 1.1s var(--ease) infinite; }

#bar { position: relative; }
.nb.dis { color: #4a4a52; pointer-events: none; }
#zoomb { display: none; height: 22px; padding: 0 7px; border-radius: 5px; font-size: 11px; font-weight: 600; color: var(--text); background: var(--hover);
  font-variant-numeric: tabular-nums; flex: none; transition: background .2s; }

#zoomb:hover { background: var(--accent); color: var(--on-accent); }
#urlview .fx { color: var(--accent); font-weight: 600; }
#lock.int { color: var(--accent); }
.restart { display: flex; align-items: center; gap: 14px; padding: 12px 16px; margin-top: 12px; border-radius: 10px;
  background: color-mix(in srgb, var(--accent) 14%, var(--card)); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); animation: fadeUp .4s var(--ease); }
.restart span { flex: 1; font-size: 12.5px; }
.rec-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 12px 0; }
.rec { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; background: var(--field); border: 1px solid var(--line);
  transition: border-color .2s, transform .3s var(--spring); }
.rec:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); transform: translateY(-2px); }
.rec .lt { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-weight: 900; font-size: 15px; color: #fff; flex: none; }
.rec .nm { flex: 1; min-width: 0; } .rec .nm b { display: block; font-size: 12.5px; } .rec .nm small { color: var(--dim); font-size: 11px; }
.rec .btn2 { height: 28px; padding: 0 12px; font-size: 11.5px; }
.rec .ok { font-size: 11px; color: #3ddc97; font-weight: 600; }
.tag { font-size: 9.5px; font-weight: 700; letter-spacing: .5px; padding: 2px 6px; border-radius: 4px; background: var(--accent); color: var(--on-accent); margin-left: 6px; vertical-align: 1px; }

/* ---------- Curseurs (range) ---------- */
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; cursor: pointer; margin: 0; --p: 50%; }
input[type=range]:focus { outline: none; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px;
  background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 70%, #000) 0%, var(--accent) var(--p), #2a2a30 var(--p), #2a2a30 100%);
  box-shadow: inset 0 1px 2px #0009, 0 0 10px -4px var(--accent-glow); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; margin-top: -5px; border-radius: 50%;
  background: #fff; border: 3px solid var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent), 0 0 12px var(--accent-glow);
  transition: transform .25s var(--spring), box-shadow .25s; }

input[type=range]:active::-webkit-slider-thumb { transform: scale(1.3); }
.rng-scale { display: flex; justify-content: space-between; font-size: 10px; color: #6c6c75; margin-top: 2px; font-variant-numeric: tabular-nums; }
.slider-row { padding: 10px 0 8px; }
.slider-row + .slider-row, .row + .slider-row, .slider-row + .row { border-top: 1px solid var(--line); }
.slider-row .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.slider-row .top small { display: block; color: var(--dim); font-size: 10.5px; }
.val-pill { font: 700 11px/1 system-ui; padding: 5px 8px; border-radius: 6px; color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); font-variant-numeric: tabular-nums; min-width: 54px; text-align: center; }

/* ---------- Control : vraies données ---------- */
.sysbar { height: 8px; border-radius: 4px; background: #2a2a30; overflow: hidden; display: flex; margin: 8px 0 6px; }
.sysbar { position: relative; display: block; }
.sysbar i { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform-origin: left; transform: scaleX(0); transition: transform .5s var(--ease); }
.sysbar .ferrox { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.sysbar .other { background: #5b5b66; }
.legend { display: flex; gap: 12px; font-size: 10.5px; color: var(--dim); flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stat { background: var(--field); border-radius: 8px; padding: 8px 6px; text-align: center; }
.stat b { display: block; font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat small { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .6px; }
.cat { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 7px 0; }
.cat + .cat { border-top: 1px solid var(--line); }
.cat .nm { font-size: 12px; } .cat .nm small { color: #6c6c75; margin-left: 4px; font-size: 10.5px; }
.cat .mb { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.cat .mb small { color: var(--dim); font-weight: 500; margin-left: 6px; }
.cat .bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: #2a2a30; overflow: hidden; }
.cat .bar i { display: block; width: 100%; height: 100%; border-radius: 2px; background: var(--c, var(--accent)); transform-origin: left; transform: scaleX(0); transition: transform .5s var(--ease); }
.trow { display: flex; align-items: center; gap: 9px; padding: 7px 0; font-size: 12px; }
.trow + .trow { border-top: 1px solid var(--line); }
.trow .fi { width: 16px; height: 16px; flex: none; display: grid; place-items: center; color: var(--dim); }
.trow .fi img { width: 16px; height: 16px; border-radius: 3px; }
.trow .fi svg { width: 14px; height: 14px; }
.trow .tt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trow .tt small { display: block; color: #6c6c75; font-size: 10.5px; }
.trow .mem { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 11.5px; white-space: nowrap; }
.trow .acts { display: flex; gap: 2px; }
.trow .acts button { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; color: var(--dim); transition: background .15s, color .15s; }
.trow .acts button:hover { background: var(--hover); color: var(--accent); }
.trow .acts svg { width: 13px; height: 13px; }
.trow.cur .tt { color: var(--accent); }

/* ---------- Paramètres : une page par catégorie ---------- */
.pg-side { display: flex; flex-direction: column; gap: 4px; padding: 12px 10px; }
.pg-side hr { margin: 8px 6px; }
.pg-side button { height: 40px; }
.pg-title { display: flex; align-items: center; gap: 12px; margin: 6px 2px 4px; font-size: 22px; font-weight: 800; letter-spacing: .3px; }
.pg-title svg { width: 24px; height: 24px; color: var(--accent); filter: drop-shadow(0 0 6px var(--accent-glow)); }
.pg-title small { font-size: 12px; color: var(--dim); font-weight: 500; margin-left: auto; }
.pg-main.swap > :not(.pg-search) { animation: fadeUp .4s var(--ease) both; }
.pg-sec .catname { display: none; font-size: 10px; color: var(--accent); letter-spacing: 1px; margin-left: 8px; }
.searching .pg-sec .catname { display: inline; }
.pg-main:not(.searching) .pg-sec h4.dup { display: none; }
.pg-sec:first-of-type { padding-top: 10px; }
.noresult { text-align: center; color: var(--dim); padding: 40px 0; display: none; }
.noresult.show { display: block; }

/* ---------- Avatars de site (repli) ---------- */
.av { width: 100%; height: 100%; border-radius: 4px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 9px; text-transform: uppercase; }

/* ---------- Historique ---------- */
.h-tools { display: flex; gap: 10px; align-items: center; padding: 10px 0 6px; flex-wrap: wrap; }
.h-tools .pg-search { flex: 1; position: static; margin: 0; min-width: 240px; }
.h-clear { display: none; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); margin: 6px 0; }
.h-clear.show { display: flex; animation: fadeUp .35s var(--ease); }
.h-clear span { flex: 1; font-size: 12.5px; }
.h-clear .dd { width: 200px; }
.h-sel { position: sticky; top: 76px; z-index: 3; display: none; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 10px; margin: 6px 0;
  background: color-mix(in srgb, var(--accent) 16%, var(--card)); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); box-shadow: 0 10px 30px -12px #000; }
.h-sel.show { display: flex; animation: fadeUp .3s var(--ease); }
.h-sel span { flex: 1; font-weight: 600; }
.h-day { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: var(--dim); margin: 20px 4px 8px; }
.h-day b { color: var(--text); }
.h-list { background: color-mix(in srgb, var(--card) 92%, transparent); border: 1px solid #ffffff0d; border-radius: 12px; padding: 4px 6px; }
.h-row { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 8px; border-radius: 8px; cursor: pointer; transition: background .15s; }
.h-row:hover { background: var(--hover); }
.h-row.sel { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.h-row .ck { width: 18px; height: 18px; border-radius: 5px; border: 2px solid #5a5a63; flex: none; display: grid; place-items: center; transition: background .15s, border-color .15s; }
.h-row .ck svg { width: 12px; height: 12px; color: #fff; opacity: 0; transform: scale(.4); transition: opacity .15s, transform .25s var(--spring); }
.h-row.sel .ck { background: var(--accent); border-color: var(--accent); }
.h-row.sel .ck svg { opacity: 1; transform: none; }
.h-row .time { width: 42px; color: var(--dim); font-size: 11.5px; font-variant-numeric: tabular-nums; flex: none; }
.h-row .fi { width: 18px; height: 18px; flex: none; }
.h-row .fi img { width: 18px; height: 18px; border-radius: 4px; }
.h-row .tt { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; overflow: hidden; }
.h-row .tt b { font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.h-row .tt small { color: var(--dim); font-size: 11.5px; white-space: nowrap; flex: none; max-width: 40%; overflow: hidden; text-overflow: ellipsis; }
.h-row .acts { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
.h-row:hover .acts { opacity: 1; }
.h-row .acts button { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; color: var(--dim); transition: background .15s, color .15s; }
.h-row .acts button:hover { background: var(--field); color: var(--accent); }
.h-row .acts button.del:hover { color: #ff5c74; }
.h-row .acts svg { width: 15px; height: 15px; }
.h-more { display: block; margin: 16px auto; }
.h-info { display: flex; gap: 14px; align-items: center; color: var(--dim); font-size: 12px; padding: 4px 4px 0; }

.btn2 { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }

#bg { position: fixed; left: var(--border); top: var(--top); right: var(--border); bottom: var(--border); background: #18181b; }

</style>
</head>

      <button class="nb badge" data-panel="shield" title="Bouclier — bloqueur & vie privée"><svg viewBox="0 0 24 24"><path d="M12 21.5s8-3.8 8-9.8V5.2L12 2.5 4 5.2v6.5c0 6 8 9.8 8 9.8z"/></svg><i id="pageblocked"></i></button>

      <button class="nb" id="histbtn" title="Historique (Ctrl+H)"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></button>
      <button class="nb" id="settingsbtn" title="Paramètres"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </div>
  </div>
</header>

<aside id="panel"></aside>
<section id="page"></section>

<script>
'use strict';
(() => {
  const $ = (s) => document.querySelector(s);
  // Canal privé vers Ferrox : fonction native capturée au chargement + clé remise par Ferrox.
  const __apply = Reflect.apply, __stringify = JSON.stringify;
  const __post = (() => {
    const w = window.chrome && window.chrome.webview;
    if (w && w.postMessage) { const f = w.postMessage; return (m) => __apply(f, w, [m]); }
    const hh = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.ipc;
    if (hh && hh.postMessage) { const f = hh.postMessage; return (m) => __apply(f, hh, [m]); }
    return () => {};
  })();
  let TOKEN = null;
  const send = (o) => {
    const s = __stringify(o);
    if (TOKEN) __post(TOKEN + '|' + s);
    else if (o.cmd === 'ready') __post(s);
  };
  const h = (tag, props = {}, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === 'class') e.className = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    }
    for (const k of kids) if (k !== '' && k != null) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
    return e;
  };
  // N'écrit dans la page que si la valeur change : chaque écriture coûte un redessin.
  const setText = (el, t) => { t = String(t); if (el.textContent !== t) el.textContent = t; };
  const setAttr = (el, k, v) => { v = String(v); if (el.getAttribute(k) !== v) el.setAttribute(k, v); };
  const setStyle = (el, k, v) => { if (el.style.getPropertyValue(k) !== String(v)) el.style.setProperty(k, v); };
  const icon = (d) => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 24 24');
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', d); s.append(p); return s; };
  const ICON = {
    x: 'M18 6L6 18M6 6l12 12', moon: 'M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z',
    globe: 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20',
    eye: 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM3 3l18 18', plus: 'M12 5v14M5 12h14',
    chev: 'M6 9l6 6 6-6', check: 'M5 12.5l4.5 4.5L19 7.5',
    gear: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.8 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3.2 14H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 3.2V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 20.8 10H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z',
    puzzle: 'M10 3.5a2 2 0 1 1 4 0V5h3a1 1 0 0 1 1 1v3h1.5a2 2 0 1 1 0 4H18v4a1 1 0 0 1-1 1h-3v-1.5a2 2 0 1 0-4 0V18H6a1 1 0 0 1-1-1v-4h1.5a2 2 0 1 0 0-4H5V6a1 1 0 0 1 1-1h4z',
    brush: 'M9.5 14.5L18 6a2.1 2.1 0 0 1 3 3l-8.5 8.5M9.5 14.5c-2 0-3.5 1.5-3.5 3.5 0 1-1 2-2 2 1 1 2.5 1.5 4 1.5 2.5 0 4.5-2 4.5-4.5',
    search: 'M11 4.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM20 20l-4.2-4.2',
    power: 'M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0',
    shield: 'M12 21.5s8-3.8 8-9.8V5.2L12 2.5 4 5.2v6.5c0 6 8 9.8 8 9.8z',
    chip: 'M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM9 9h6v6H9zM9 1.5V4M15 1.5V4M9 20v2.5M15 20v2.5M1.5 9H4M1.5 15H4M20 9h2.5M20 15h2.5',
    down: 'M12 4v11M7 10l5 5 5-5M5 20h14',
    keys: 'M3 6h18v12H3zM7 10h.01M11 10h.01M15 10h.01M7 14h10',
    info: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 16v-4M12 8h.01',
    store: 'M4 8h16l-1 12H5zM8 8V6a4 4 0 0 1 8 0v2',
    trash: 'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3',
    tabs: 'M3 7h7l2-3h9v16H3zM3 7v13',
    clock: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6v6l4 2',
    key: 'M15 7a4 4 0 1 1-3.9 4.9L4 19v2h3v-2h2v-2h2l1.1-1.1A4 4 0 0 1 15 7zM16 10h.01',
    play: 'M5 4l14 8-14 8z',
    cpu: 'M9 3v2M15 3v2M9 19v2M15 19v2M3 9h2M3 15h2M19 9h2M19 15h2M7 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zM9 9h6v6H9z',
    reset: 'M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5',
  };

  let S = null, editingUrl = false;

  // =================== Onglets (mise à jour incrémentale → animations) ===================
  const tabEls = new Map();
  const newTabBtn = h('button', { id: 'newtab', title: 'Nouvel onglet (Ctrl+T)', onclick: () => send({ cmd: 'new_tab', private: false }) }, icon(ICON.plus));

  function makeTab(id) {
    const el = h('div', {
      class: 'tab enter',
      onmousedown: (e) => { if (e.button === 1) { e.preventDefault(); send({ cmd: 'close', id }); } },
      onclick: () => send({ cmd: 'switch', id }),
    }, h('span', { class: 'ic' }), h('span', { class: 't' }),
       h('button', { class: 'x', title: 'Fermer (Ctrl+W)', onclick: (e) => { e.stopPropagation(); send({ cmd: 'close', id }); } }, icon(ICON.x)));
    el.addEventListener('animationend', () => el.classList.remove('enter'), { once: true });
    return el;
  }
  function updateTab(el, t) {
    el.classList.toggle('active', t.active);
    el.classList.toggle('sleeping', t.sleeping);
    el.classList.toggle('private', t.private);
    setAttr(el, 'title', t.title + (t.sleeping ? ' (en veille)' : ''));
    setText(el.children[1], t.title || 'Sans titre');
    const key = t.page === 'settings' ? 'gear' : t.page === 'extensions' ? 'puzzle' : t.page === 'history' ? 'clock' : t.loading ? 'load' : t.sleeping ? 'moon' : t.private ? 'eye' : (t.favicon || (S.settings.site_icons && /^https?:/.test(t.url))) ? 'fav:' + (t.favicon || '') + t.url : 'globe';
    if (el._ic !== key) {
      el._ic = key;
      el.children[0].classList.toggle('pg', !!t.page);
      let node;
      if (key === 'load') node = h('span', { class: 'spin' });
      else if (key.startsWith('fav:')) {
        node = siteIcon(t.url, t.favicon);
        if (node.tagName !== 'IMG') node = icon(ICON.globe);
      } else node = icon(ICON[key]);
      el.children[0].replaceChildren(node);
    }
  }
  const glider = h('div', { id: 'glider' });
  const animOn = () => S && S.settings.animations;
  function placeGlider(instant) {
    const act = [...tabEls.values()].find((el) => el.classList.contains('active'));
    if (!act) { glider.classList.remove('ready'); return; }
    if (instant || !animOn()) glider.style.transition = 'none';
    setStyle(glider, 'width', act.offsetWidth + 'px');
    setStyle(glider, 'transform', `translateX(${act.offsetLeft}px)`);
    if (instant || !animOn()) { void glider.offsetWidth; glider.style.transition = ''; }
    if (!glider.classList.contains('ready')) glider.classList.add('ready');
  }
  addEventListener('resize', () => placeGlider(true));

  function renderTabs() {
    const box = $('#tabs'), seen = new Set();
    if (!glider.isConnected) box.prepend(glider);
    // FLIP : positions avant la mise à jour…
    const before = new Map();
    const structural = S.tabs.length !== tabEls.size || S.tabs.some((t) => !tabEls.has(t.id));
    if (structural && animOn()) for (const [id, el] of tabEls) before.set(id, el.getBoundingClientRect().left);
    const nbBefore = newTabBtn.isConnected ? newTabBtn.getBoundingClientRect().left : null;
    let prev = glider;
    for (const t of S.tabs) {
      seen.add(t.id);
      let el = tabEls.get(t.id);
      if (!el) { el = makeTab(t.id); tabEls.set(t.id, el); }
      updateTab(el, t);
      const ref = prev ? prev.nextSibling : box.firstChild;
      if (el !== ref) box.insertBefore(el, ref);
      prev = el;
    }
    for (const [id, el] of tabEls) if (!seen.has(id)) {
      tabEls.delete(id);
      if (!animOn()) { el.remove(); continue; }
      // L'onglet fermé reste à sa place (position absolue) le temps de disparaître.
      const left = el.offsetLeft, w = el.offsetWidth;
      el.classList.remove('enter', 'active'); el.classList.add('leave');
      el.style.left = left + 'px'; el.style.width = w + 'px'; el.style.top = '4px';
      setTimeout(() => el.remove(), 230);
    }
    if (box.lastChild !== newTabBtn) box.append(newTabBtn);
    // …puis on fait glisser chaque onglet depuis son ancienne position (GPU : transform).
    if (before.size) {
      const ease = 'cubic-bezier(.22, 1, .36, 1)';
      for (const [id, x] of before) {
        const el = tabEls.get(id); if (!el) continue;
        const dx = x - el.getBoundingClientRect().left;
        if (Math.abs(dx) > 0.5) el.animate([{ transform: `translateX(${dx}px)` }, { transform: 'none' }], { duration: 360, easing: ease });
      }
      if (nbBefore != null) {
        const dx = nbBefore - newTabBtn.getBoundingClientRect().left;
        if (Math.abs(dx) > 0.5) newTabBtn.animate([{ transform: `translateX(${dx}px)` }, { transform: 'none' }], { duration: 360, easing: ease });
      }
    }
    placeGlider(!glider.classList.contains('ready'));
  }

  // =================== Barre de navigation ===================
  function renderUrlView(u) {
    const v = $('#urlview'); v.replaceChildren();
    if (!u) return;
    if (u.startsWith('ferrox://')) { v.append(h('span', { class: 'fx' }, 'ferrox://'), h('span', {}, u.slice(9))); return; }
    try {
      const x = new URL(u);
      v.append(h('span', {}, x.host), h('span', { class: 'p' }, (x.pathname === '/' ? '' : x.pathname) + x.search));
    } catch (_) { v.append(h('span', {}, u)); }
  }
  let lastBlocked = 0;
  function renderBar() {
    const t = S.tabs.find((x) => x.active) || {};
    if (!editingUrl) $('#url').value = t.url || '';
    renderUrlView(editingUrl ? '' : t.url);
    $('.urlwrap').classList.toggle('show-view', !editingUrl && !!t.url);
    const lock = $('#lock');
    const internal = !!t.url && t.url.startsWith('ferrox://');
    lock.classList.toggle('int', internal);
    lock.classList.toggle('insecure', !!t.url && !internal && !t.url.startsWith('https://') && !t.url.startsWith('chrome-extension://'));
    setStyle(lock, 'opacity', t.url ? '1' : '0.35');
    setAttr(lock, 'title', t.url && t.url.startsWith('https://') ? 'Connexion chiffrée (HTTPS)' : 'Connexion non chiffrée');
    const pb = $('#pageblocked'), nbk = t.blocked || 0;
    setText(pb, nbk ? (nbk > 99 ? '99+' : nbk) : '');
    if (nbk !== lastBlocked && nbk) { pb.classList.remove('pop'); void pb.offsetWidth; pb.classList.add('pop'); }
    lastBlocked = nbk;
    setText($('#miniram'), S.usage.ram || '–');
    $('#loadbar').classList.toggle('on', !!t.loading);
    $('#back').classList.toggle('dis', !t.can_back);
    $('#fwd').classList.toggle('dis', !t.can_fwd);
    const zb = $('#zoomb'), z = t.zoom || 100;
    zb.classList.toggle('show', z !== 100); setText(zb, z + ' %');
    const wm = $('#wmax');
    if (wm._m !== !!S.maximized) {
      wm._m = !!S.maximized;
      wm.title = S.maximized ? 'Restaurer' : 'Agrandir';
      wm.innerHTML = S.maximized
        ? '<svg viewBox="0 0 24 24"><rect x="4" y="8" width="12" height="12" rx="1.5"/><path d="M8 8V5.5A1.5 1.5 0 0 1 9.5 4H18.5A1.5 1.5 0 0 1 20 5.5V14.5A1.5 1.5 0 0 1 18.5 16H16"/></svg>'
        : '<svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1.5"/></svg>';
    }
    document.body.classList.toggle('max', !!S.maximized);
    const n = S.notice, nb = $('#notice');
    const nkey = n ? n.kind + n.url : '';
    if (nb._k !== nkey) {
      nb._k = nkey;
      nb.classList.toggle('show', !!n);
      if (n) {
        const act = $('#noticeact'); act.style.display = 'none'; act.onclick = null;
        let host = ''; try { host = new URL(n.url).host; } catch (_) { host = n.url; }
        const msg = { http: 'HTTP non sécurisé bloqué : ' + host, blocked: 'Traqueur bloqué : ' + host, download: 'Téléchargement en cours…',
          download_done: 'Téléchargement terminé (dossier Téléchargements)', cleared: 'Données de navigation effacées' }[n.kind] || '';
        $('#noticetxt').textContent = msg;
        if (n.kind === 'http') { act.textContent = 'Autoriser ce site'; act.style.display = ''; act.onclick = () => send({ cmd: 'allow_http', url: n.url }); }
      }
    }
    document.querySelectorAll('[data-panel]').forEach((b) => b.classList.toggle('on', b.dataset.panel === S.panel));
  }

  // =================== Composants ===================
  const setS = (patch) => send({ cmd: 'settings', settings: { ...S.settings, ...patch } });
  const live = {};

  function ring(name) {
    const C = 2 * Math.PI * 27;
    const wrap = h('div', { class: 'ring' });
    wrap.innerHTML = `<svg viewBox="0 0 66 66"><circle class="bgc" cx="33" cy="33" r="27"/><circle class="fg" cx="33" cy="33" r="27" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>`;
    const label = h('b', {}, '0%');
    wrap.append(label);
    const fg = wrap.querySelector('.fg');
    live[name] = { set(pct, text) {
      // n'écrit dans la page que si la valeur affichée change (évite de redessiner)
      const v = Math.round(Math.max(0, Math.min(1, pct)) * 100);
      if (fg._v !== v) { fg._v = v; fg.style.strokeDashoffset = C * (1 - v / 100); }
      if (label.textContent !== text) label.textContent = text;
    } };
    return wrap;
  }
  const toggle = (key, title, sub) => h('div', { class: 'row' },
    h('div', {}, title, h('small', {}, sub)),
    h('button', { class: 'toggle' + (S.settings[key] ? ' on' : ''), role: 'switch', 'aria-checked': String(!!S.settings[key]),
      onclick: (e) => { e.currentTarget.classList.toggle('on'); setS({ [key]: !S.settings[key] }); } }));
  // Menu déroulant entièrement stylé (remplace <select>), clavier compris.
  let closeOpenDD = null;
  function dropdown(items, value, onPick) {
    const cur = items.find((i) => i.value === value) || items[0];
    const wrap = h('div', { class: 'dd' });
    const btn = h('button', { class: 'dd-btn', type: 'button', 'aria-haspopup': 'listbox' },
      h('span', { class: 'dd-dot' }), h('span', { class: 'dd-val' }, cur.label), icon(ICON.chev));
    btn.lastChild.classList.add('chev');
    const list = h('div', { class: 'dd-list', role: 'listbox' });
    const opts = items.map((it) => {
      const b = h('button', { class: 'dd-item' + (it.value === value ? ' sel' : ''), type: 'button', role: 'option',
        onclick: (e) => { e.stopPropagation(); close(); if (it.value !== value) onPick(it.value); } },
        h('span', {}, it.label), it.hint ? h('small', {}, it.hint) : '', icon(ICON.check));
      b.lastChild.classList.add('ck');
      list.append(b);
      return b;
    });
    let kb = -1;
    const mark = (i) => { opts.forEach((o, j) => o.classList.toggle('kb', j === i)); kb = i; };
    function open() { if (closeOpenDD) closeOpenDD(); wrap.classList.add('open'); closeOpenDD = close; mark(items.indexOf(cur)); }
    function close() { wrap.classList.remove('open'); mark(-1); if (closeOpenDD === close) closeOpenDD = null; }
    btn.addEventListener('click', (e) => { e.stopPropagation(); wrap.classList.contains('open') ? close() : open(); });
    wrap.addEventListener('keydown', (e) => {
      if (!wrap.classList.contains('open')) { if (e.key === 'ArrowDown') { e.preventDefault(); open(); } return; }
      if (e.key === 'ArrowDown') { e.preventDefault(); mark((kb + 1) % opts.length); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); mark((kb - 1 + opts.length) % opts.length); }
      else if (e.key === 'Enter' && kb >= 0) { e.preventDefault(); opts[kb].click(); }
      else if (e.key === 'Escape') { e.preventDefault(); close(); btn.focus(); }
    });
    wrap.append(btn, list);
    return wrap;
  }
  document.addEventListener('click', () => closeOpenDD && closeOpenDD());

  // =================== Panneaux ===================
  function panelShield(p) {
    p.append(h('h2', {}, 'Bouclier'),
      h('div', { class: 'card' }, live.blocked = h('div', { class: 'big' }, '0'),
        h('small', { style: 'color:var(--dim)' }, 'publicités & traqueurs bloqués cette session · ' + S.blocklist.toLocaleString('fr-FR') + ' domaines en liste')),
      h('div', { class: 'card' },
        toggle('adblock', 'Bloqueur pubs & traqueurs', 'S\'applique aux pages rechargées'),
        toggle('https_only', 'Mode HTTPS uniquement', 'Bloque les connexions non chiffrées'),
        toggle('block_permissions', 'Bloquer caméra / micro / position', 'Refus automatique des permissions'),
        toggle('anti_fingerprint', 'Anti-empreinte strict', 'Désactive WebGL et WebAudio')),
      h('div', { class: 'card' }, h('small', { style: 'color:var(--dim)' },
        'Toujours actifs : Global Privacy Control, Do-Not-Track, pas de préchargement DNS, popups → onglets, schémas file:// et javascript: refusés, processus web isolés dans un bac à sable, SmartScreen anti-phishing (Windows).')),
      h('button', { class: 'btn', onclick: () => send({ cmd: 'clear_data' }) }, 'Effacer cookies & données de navigation'));
  }

  // =================== Icônes de sites ===================
  const hostOf = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (_) { return ''; } };
  const hue = (s) => { let x = 0; for (const c of s) x = (x * 31 + c.charCodeAt(0)) >>> 0; return x % 360; };
  function avatar(host) {
    return h('span', { class: 'av', style: `background:hsl(${hue(host)} 55% 38%)` }, (host || '?')[0]);
  }
  /** Icône d'un site : celle fournie par la page, sinon /favicon.ico du site, sinon une lettre. */
  function siteIcon(url, given) {
    const host = hostOf(url);
    // Icône demandée au site lui-même (aucun service tiers ne voit les sites visités).
    const origin = (() => { try { const x = new URL(url); return x.protocol === 'https:' ? x.origin : ''; } catch (_) { return ''; } })();
    const src = given || (S.settings.site_icons && origin ? origin + '/favicon.ico' : '');
    if (!src) return avatar(host);
    const img = h('img', { alt: '', referrerpolicy: 'no-referrer', loading: 'lazy' });
    img.addEventListener('error', () => {
      // l'icône de la page a échoué → on tente /favicon.ico du site, puis la lettre

  // Valeurs qui changent toutes les 2 s : mises à jour sur place (pas de reconstruction).
  function updateLive() {
    const u = S.usage, ram = u.ram, lim = S.settings.ram_limit_mb;
    if (live.ram && live.ramVal && live.ramVal.isConnected) {
      live.ram.set(ram / lim, Math.round(100 * ram / lim) + '%');
      const setT = (el, t) => { if (el.textContent !== t) el.textContent = t; };
      setT(live.ramVal, fmtMb(ram));
      setT(live.ramLim, 'limite ' + fmtMb(lim) + (u.sys_total ? ' · ' + (100 * ram / u.sys_total).toFixed(1).replace('.', ',') + ' % de la RAM' : ''));
      live.cpu.set(u.cpu / 100, Math.round(u.cpu) + '%');
      setT(live.cpuVal, u.cpu.toFixed(1).replace('.', ',') + ' %'); setT(live.procs, u.procs + ' processus');
      if (u.sys_total) {
        const other = Math.max(0, u.sys_used - ram);
        const fF = ram / u.sys_total, fO = other / u.sys_total;
        live.sysF.style.transform = `scaleX(${fF})`;
        live.sysO.style.transform = `translateX(${fF * 100}%) scaleX(${fO})`;
        live.sysO.style.transformOrigin = 'left';
        const lk = [ram, other, u.sys_total - u.sys_used].map(Math.round).join();
        if (live.legend._k !== lk) live.legend._k = lk, live.legend.replaceChildren(
          h('span', { style: '--c:var(--accent)' }, 'Ferrox ' + fmtMb(ram)),
          h('span', { style: '--c:#5b5b66' }, 'Autres applis ' + fmtMb(other)),
          h('span', { style: '--c:#2a2a30' }, 'Libre ' + fmtMb(Math.max(0, u.sys_total - u.sys_used)) + ' / ' + fmtMb(u.sys_total)));
      }
      const open = S.tabs.length, sleeping = S.tabs.filter((t) => t.sleeping).length;
      if (live.stats._k !== open + '/' + sleeping) live.stats._k = open + '/' + sleeping, live.stats.replaceChildren(
        h('div', { class: 'stat' }, h('b', {}, open), h('small', {}, 'Onglets')),
        h('div', { class: 'stat' }, h('b', {}, open - sleeping), h('small', {}, 'En mémoire')),
        h('div', { class: 'stat' }, h('b', {}, sleeping), h('small', {}, 'En veille')));
      // répartition par rôle (lignes réutilisées → les barres glissent)
      const max = Math.max(1, ...u.cats.map((c) => c.ram_mb));
      const seen = new Set();
      for (const c of u.cats) {
        seen.add(c.key);
        let r = live.catRows.get(c.key);
        if (!r) {
          r = { nm: h('div', { class: 'nm' }), mb: h('div', { class: 'mb' }), bar: h('i') };
          r.el = h('div', { class: 'cat', style: '--c:' + (CAT_COLORS[c.key] || 'var(--accent)') }, r.nm, r.mb, h('div', { class: 'bar' }, r.bar));
          live.catRows.set(c.key, r); live.cats.append(r.el);
        }
        const k = c.procs + '|' + Math.round(c.ram_mb) + '|' + c.cpu.toFixed(1);
        if (r._k !== k) {
          r._k = k;
          r.nm.replaceChildren(c.label, h('small', {}, c.procs + ' proc.'));
          r.mb.replaceChildren(fmtMb(c.ram_mb), h('small', {}, c.cpu.toFixed(1).replace('.', ',') + ' %'));
        }
        const sc = (c.ram_mb / max).toFixed(3);
        if (r._s !== sc) { r._s = sc; r.bar.style.transform = `scaleX(${sc})`; }
      }
      for (const [k, r] of live.catRows) if (!seen.has(k)) { r.el.remove(); live.catRows.delete(k); }
      // mémoire par onglet
      for (const t of S.tabs) {
        const el = live.tmem && live.tmem.get(t.id); if (!el) continue;
        const txt = t.page ? '' : t.sleeping ? '0 Mo' : (u.per_tab ? (t.mem != null ? fmtMb(t.mem) + (t.shared ? '*' : '') : '…') : 'actif') + (t.suspended ? ' ⏸' : '');
        if (el.textContent !== txt) el.textContent = txt;
        setAttr(el, 'title', t.suspended ? 'Onglet suspendu : scripts gelés, il reprend dès que vous l\'ouvrez' : t.shared ? 'Processus partagé avec d\'autres onglets du même site : mémoire répartie' : '');
        setStyle(el, 'color', t.sleeping ? 'var(--dim)' : '');
      }
    }
    if (live.blocked && live.blocked.isConnected) live.blocked.textContent = S.blocked_total.toLocaleString('fr-FR');
  }

    const full = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: d.getFullYear() !== today.getFullYear() ? 'numeric' : undefined });
    return diff === 0 ? ['Aujourd\'hui', full] : diff === 1 ? ['Hier', full] : [full, ''];

          h('button', { class: 'del', title: 'Supprimer de l\'historique', onclick: () => { H.items = H.items.filter((x) => x.id !== e.id); H.total--; H.count--; renderHistoryList(); send({ cmd: 'history_delete', ids: [e.id] }); } }, icon(ICON.trash))));

  function buildExtensions(main) {
    const inp = h('input', { class: 'txt', id: 'extin', placeholder: 'Collez le lien de l\'extension (chromewebstore.google.com/detail/…)' });
    const go = () => { if (inp.value.trim()) { send({ cmd: 'ext_install', input: inp.value.trim() }); inp.value = ''; inp.blur(); } };
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    const busy = S.ext_status && S.ext_status.busy;
    const card = h('div', { class: 'pg-card' });
    if (!S.ext_supported) {
      card.append(h('div', { class: 'empty' }, icon(ICON.puzzle), h('div', {}, 'Les extensions Chrome nécessitent Windows (moteur WebView2).'),
        h('small', {}, 'WebKit (Linux / macOS) ne prend pas en charge ce format.')));
    } else {
      card.append(h('div', { class: 'ext-install' }, inp,
        h('button', { class: 'btn2', onclick: go, ...(busy ? { disabled: '' } : {}) }, 'Installer'),
        h('button', { class: 'btn2 ghost', title: 'Ouvrir le Chrome Web Store dans un nouvel onglet', onclick: () => send({ cmd: 'open_url', url: 'https://chromewebstore.google.com/category/extensions' }) }, icon(ICON.store))));
      if (S.ext_status) card.append(h('div', { class: 'ext-status' }, busy ? h('span', { class: 'spin' }) : '', S.ext_status.msg));
    }
    main.append(h('section', { class: 'pg-sec' }, h('h4', {}, 'Ajouter depuis le Chrome Web Store'), card));

    if (S.ext_supported) {
      const REC = [
        ['ddkjiahejlhfcafbddmgiahcphecmpfh', 'uBlock Origin Lite', 'Bloqueur de pubs et traqueurs (par l\'auteur d\'uBlock Origin)', 'uB', '#800000', true],
      ];
      const rg = h('div', { class: 'rec-grid' });
      for (const [id, name, desc, lt, col, star] of REC) {
        const have = S.exts.some((e) => e.id === id);
        rg.append(h('div', { class: 'rec' }, h('div', { class: 'lt', style: 'background:' + col }, lt),
          h('div', { class: 'nm' }, h('b', {}, name, star ? h('span', { class: 'tag' }, 'CONSEILLÉ') : ''), h('small', {}, desc)),
          have ? h('span', { class: 'ok' }, '✔ Installée') : h('button', { class: 'btn2', ...(busy ? { disabled: '' } : {}), onclick: () => send({ cmd: 'ext_install', input: id }) }, 'Installer')));
      }
      main.append(h('section', { class: 'pg-sec' }, h('h4', {}, 'Extension recommandée'), h('div', { class: 'pg-card' }, rg)));
    }
    const grid = h('div', { class: 'ext-grid' });
    S.exts.forEach((e, i) => {
      let armed = false;
      const del = h('button', { class: 'btn2 danger', title: 'Supprimer', onclick: (ev) => {
        if (!armed) { armed = true; ev.currentTarget.textContent = 'Confirmer ?'; setTimeout(() => { armed = false; if (del.isConnected) del.replaceChildren(icon(ICON.trash)); }, 3000); return; }
        send({ cmd: 'ext_remove', id: e.id }); } }, icon(ICON.trash));
      grid.append(h('div', { class: 'ext' + (e.enabled ? '' : ' off'), style: `animation-delay:${Math.min(i, 8) * 40}ms` },
        h('div', { class: 'hd' }, h('div', { class: 'ico' }, extIcon(e, ' ')),
          h('div', { class: 'nm' }, h('b', {}, e.name), h('small', {}, (e.version ? 'v' + e.version + ' · ' : '') + e.id.slice(0, 12) + '…')),
          h('button', { class: 'toggle' + (e.enabled ? ' on' : ''), title: e.enabled ? 'Désactiver' : 'Activer',
            onclick: (ev) => { ev.currentTarget.classList.toggle('on'); send({ cmd: 'ext_enable', id: e.id, on: !e.enabled }); } })),
        h('p', {}, e.description || ''),
        h('div', { class: 'ft' },
          e.popup ? h('button', { class: 'btn2', onclick: () => send({ cmd: 'ext_open', id: e.id, page: 'popup' }) }, 'Ouvrir') : '',
          e.options ? h('button', { class: 'btn2 ghost', onclick: () => send({ cmd: 'ext_open', id: e.id, page: 'options' }) }, 'Options') : '',
          h('span', { class: 'grow' }), del)));
    });
    main.append(h('section', { class: 'pg-sec' }, h('h4', {}, 'Extensions installées', h('span', { class: 'pill' }, S.exts.length)),
      S.exts.length ? grid : h('div', { class: 'pg-card' }, h('div', { class: 'empty' }, icon(ICON.puzzle), 'Aucune extension pour l\'instant'))),
      h('div', { class: 'note' }, 'Les extensions s\'exécutent dans le moteur WebView2 d\'Edge, qui ne prend en charge qu\'une partie des API Chrome. Les bloqueurs (uBlock Origin Lite…), les thèmes sombres et les gestionnaires de mots de passe fonctionnent généralement. « Ouvrir » affiche la fenêtre de l\'extension sous le bouton Extensions ; Échap ou un clic ailleurs la ferme. uBlock Origin « classique » (Manifest V2) n\'est plus accepté par le moteur d\'Edge : utilisez uBlock Origin Lite, du même auteur.'));
  }

  let pageSig = '', lastPage = null;
  let curCat = (() => { try { return localStorage.getItem('fx.cat') || 'apparence'; } catch (_) { return 'apparence'; } })();
  function renderPage() {
    const pg = $('#page'), cur = (S.tabs.find((t) => t.active) || {}).page || null;
    document.documentElement.style.setProperty('--pr', S.panel ? `calc(var(--border) + var(--panel))` : 'var(--border)');
    pg.classList.toggle('show', !!cur);
    if (!cur) { lastPage = null; pageSig = ''; return; }
    const sig = JSON.stringify([cur, S.settings, cur === 'history' ? 0 : [S.exts, S.ext_status, S.blocklist, S.about, S.restart_needed, S.history_count], cur === 'settings' ? S.blocked_total : 0]);
    const ae = document.activeElement, typing = ae && pg.contains(ae) && ae.matches('input:not([type=range]):not([type=color])');
    if (sig === pageSig || closeOpenDD || (typing && cur === lastPage && ae.id !== 'pgq')) return;
    const scroller = pg.querySelector('.pg-scroll'), scroll = scroller ? scroller.scrollTop : 0;
    const q = (pg.querySelector('#pgq') || {}).value || '', hadQ = ae && ae.id === 'pgq';
    pageSig = sig;
    const main = h('main', { class: 'pg-main' });
    let side = '';
    if (cur === 'settings') {
      buildSettings(main);
      side = h('aside', { class: 'pg-side' }, ...SECTIONS.map((s) => s ? h('button', { 'data-sec': s[0], onclick: () => {
        curCat = s[0]; try { localStorage.setItem('fx.cat', curCat); } catch (_) {}
        const qi = pg.querySelector('#pgq'); if (qi) qi.value = '';
        showCat(true); pg.querySelector('.pg-scroll').scrollTop = 0; } },
        icon(ICON[s[2]]), h('span', {}, s[1])) : h('hr')));
    } else if (cur === 'history') buildHistory(main);
    else buildExtensions(main);
    const body = h('div', { class: 'pg-body' }, side || h('div'), main);
    if (cur !== 'settings') body.style.gridTemplateColumns = 'minmax(0, 900px)';
    if (!side) body.firstChild.remove();
    const sc = h('div', { class: 'pg-scroll' }, pageTop(cur), body);
    pg.replaceChildren(h('div', { class: 'pg-grid' }), sc);

    // Une page par catégorie ; la recherche parcourt toutes les catégories.
    function showCat(animate) {
      const qi = pg.querySelector('#pgq'); if (!qi) return;
      const v = qi.value.trim().toLowerCase();
      main.classList.toggle('searching', !!v);
      let visible = 0;
      pg.querySelectorAll('.pg-sec').forEach((s) => {
        if (!v) {
          s.querySelectorAll('.pg-row').forEach((r) => r.classList.remove('hide'));
          const on = s.dataset.cat === curCat; s.classList.toggle('hide', !on); if (on) visible++;
          return;
        }
        let any = s.querySelector('h4').firstChild.textContent.toLowerCase().includes(v);
        s.querySelectorAll('.pg-row').forEach((r) => { const m = any || (r.dataset.k + ' ' + r.textContent).toLowerCase().includes(v); r.classList.toggle('hide', !m); if (m) any = true; });
        s.classList.toggle('hide', !any); if (any) visible++;
      });
      const c = SECTIONS.find((x) => x && x[0] === curCat) || SECTIONS[0];
      const t = pg.querySelector('#pgtitle');
      t.replaceChildren(...(v ? [icon(ICON.search), 'Résultats pour « ' + qi.value.trim() + ' »'] : [icon(ICON[c[2]]), c[1]]));
      pg.querySelector('#pgnone').classList.toggle('show', !visible);
      pg.querySelectorAll('.pg-side button').forEach((b) => b.classList.toggle('on', !v && b.dataset.sec === curCat));
      if (animate && S.settings.animations) { main.classList.remove('swap'); void main.offsetWidth; main.classList.add('swap'); }
    }
    const qi = pg.querySelector('#pgq');
    if (qi) {
      qi.addEventListener('input', () => showCat(false));
      qi.value = q;
      if (hadQ) { qi.focus(); qi.setSelectionRange(q.length, q.length); }
      showCat(false);
    }
    if (cur === lastPage) sc.scrollTop = scroll;
    else if (S.settings.animations) { pg.classList.remove('anim'); void pg.offsetWidth; pg.classList.add('anim'); setTimeout(() => pg.classList.remove('anim'), 700); }
    lastPage = cur;
  }

  window.fx = {
    render(state) {
      S = state;
      const r = document.documentElement.style;
      r.setProperty('--accent', S.settings.accent);
      r.setProperty('--top', S.layout.top + 'px');
      r.setProperty('--border', S.layout.border + 'px');
      r.setProperty('--panel', S.layout.panel + 'px');
      r.setProperty('--radius', (S.layout.radius || 0) + 'px');
      applyTheme();
      renderTabs(); renderBar(); renderPanel(); renderPage();
    },
    focusUrl() { const u = $('#url'); u.focus(); u.select(); },
    setToken(t) { if (TOKEN === null && typeof t === 'string') TOKEN = t; },
    history(d) {
      if (d.q !== H.q) return; // réponse à une ancienne recherche
      H.items = d.offset ? H.items.concat(d.items) : d.items;
      H.total = d.total; H.count = d.count; H.loading = false;
      renderHistoryList();
    },
    historyChanged() { H.sel.clear(); historyQuery(0); },
  };

  // =================== Interactions ===================
  const url = $('#url');
  url.addEventListener('focus', () => { editingUrl = true; if (S) renderBar(); setTimeout(() => url.select(), 0); });
  url.addEventListener('blur', () => { editingUrl = false; if (S) renderBar(); });
  url.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { send({ cmd: 'navigate', input: url.value }); url.blur(); }
    if (e.key === 'Escape') url.blur();
  });
  $('#back').onclick = () => send({ cmd: 'back' });
  $('#fwd').onclick = () => send({ cmd: 'forward' });
  const rl = $('#reload');
  rl.onclick = () => { rl.classList.remove('turn'); void rl.offsetWidth; rl.classList.add('turn'); send({ cmd: 'reload' }); };
  $('#home').onclick = () => send({ cmd: 'home' });
  $('#settingsbtn').onclick = () => send({ cmd: 'open_page', name: 'settings' });
  $('#histbtn').onclick = () => send({ cmd: 'open_page', name: 'history' });
  $('#privbtn').onclick = () => send({ cmd: 'new_tab', private: true });
  $('#wsearch').onclick = () => fx.focusUrl();
  $('#wmin').onclick = () => send({ cmd: 'minimize' });
  $('#wmax').onclick = () => send({ cmd: 'maximize' });
  $('#wclose').onclick = () => send({ cmd: 'quit' });
  $('#noticex').onclick = () => { $('#notice').classList.remove('show'); };
  document.querySelectorAll('[data-panel]').forEach((b) => b.onclick = () => send({ cmd: 'panel', name: b.dataset.panel }));
  document.querySelectorAll('.rz').forEach((z) => z.addEventListener('mousedown', (e) => {
    if (e.button === 0) { e.preventDefault(); send({ cmd: 'resize', dir: z.dataset.dir }); }
  }));

  // Déplacement de la fenêtre : zones vides de la barre d'onglets.
  const isDragZone = (el) => el && (el.id === 'titlebar' || el.id === 'tabs' || el.id === 'drag' || !!el.closest('#logo'));
  $('#titlebar').addEventListener('mousedown', (e) => {
    if (e.button === 0 && isDragZone(e.target) && e.detail === 1) send({ cmd: 'drag' });
  });
  $('#titlebar').addEventListener('dblclick', (e) => { if (isDragZone(e.target)) send({ cmd: 'maximize' }); });

  addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'escape') {
      if (closeOpenDD) { closeOpenDD(); return; }
      if (S && S.panel) { send({ cmd: 'panel', name: S.panel }); return; }
      send({ cmd: 'key', k: 'esc' }); return;
    }
    let c = null;
    if (e.ctrlKey && !e.altKey) {
      if (k === 'l') { e.preventDefault(); fx.focusUrl(); return; }
      if (k === 'r') { e.preventDefault(); rl.click(); return; }
      if (k === 'tab') c = e.shiftKey ? 'prev' : 'next';
      else if (e.shiftKey && k === 't') c = 'T';
      else if (e.shiftKey && k === 'n') c = 'n';
      else if (!e.shiftKey && (k === 't' || k === 'w' || k === 'h')) c = k;
      else if (!e.shiftKey && /^[1-9]$/.test(k)) c = k;
      else if (k === '+' || k === '=') c = 'zin';
      else if (k === '-') c = 'zout';
      else if (k === '0') c = 'z0';
    } else if (e.altKey && k === 'arrowleft') c = 'back';
    else if (e.altKey && k === 'arrowright') c = 'fwd';
    else if (k === 'f5') { e.preventDefault(); rl.click(); return; }
    else if (k === 'f11') c = 'f11';
    if (c && !(e.target.matches && e.target.matches('input') && ['zin', 'zout', 'z0'].includes(c))) { e.preventDefault(); send({ cmd: 'key', k: c }); }
  });
  // Un clic n'importe où dans l'interface ferme la fenêtre d'extension.
  addEventListener('mousedown', (e) => { if (S && S.popup && !e.target.closest('[data-panel="extensions"], .pext, .ext .ft')) send({ cmd: 'close_popup' }); }, true);
  $('#zoomb').onclick = () => send({ cmd: 'zoom', delta: 0 });
  addEventListener('contextmenu', (e) => { if (!e.target.matches('input')) e.preventDefault(); });
  send({ cmd: 'ready' });
})();
</script>
</body>
</html>
