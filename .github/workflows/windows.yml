name: Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compiler (release)
        run: cargo build --release
      - name: Tests
        run: cargo test --release
      - name: Empaqueter
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/ferrox.exe dist/
          $dll = Get-ChildItem -Recurse target/release/build -Filter WebView2Loader.dll | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName dist/ }
      - uses: actions/upload-artifact@v4
        with:
          name: ferrox-windows-x64
          path: dist/
