[package]
name = "ferrox"
version = "2.0.0"
edition = "2024"
description = "Ferrox — navigateur web gaming léger et sécurisé, écrit en Rust (moteur Chromium via CEF)"
license = "MIT"

# Modèle « bac à sable » de CEF sous Windows : Ferrox.exe (bootstrap.exe de CEF, renommé)
# charge ferrox.dll et appelle `RunWinMain`. Tous les processus du navigateur sont des Ferrox.exe.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["sandbox"]
sandbox = ["cef/sandbox"]
# Vérification locale sans les binaires CEF (aucune compilation C++ ni édition de liens).
dox = ["cef/dox"]

[dependencies]
cef = { version = "=158.0.0", default-features = false }
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
tao = "0.38.0"
ureq = { version = "3.5.2", default-features = false, features = ["native-tls", "gzip"] }
base64 = "0.23.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
